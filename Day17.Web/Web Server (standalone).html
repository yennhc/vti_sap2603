  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r:var(--accent);flex:none;\">04<\u002Fspan>\n        <span><span style=\"display:block;color:#eaf0ff;font-weight:600;font-size:15px;\">So sánh chi tiết<\u002Fspan><span style=\"display:block;color:#7c88ad;font-size:12px;\">Bảng so sánh 3 web server<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n      <button onclick=\"{{ goThucHanh }}\" style=\"text-align:left;display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;\" style-hover=\"background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.4);transform:translateY(-3px);\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent);flex:none;\">05<\u002Fspan>\n        <span><span style=\"display:block;color:#eaf0ff;font-weight:600;font-size:15px;\">Thực hành<\u002Fspan><span style=\"display:block;color:#7c88ad;font-size:12px;\">Cài đặt &amp; deploy web<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n      <button onclick=\"{{ goTomTat }}\" style=\"text-align:left;display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.28);cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;\" style-hover=\"background:rgba(139,92,246,.16);transform:translateY(-3px);\">\n        <span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--accent2);flex:none;\">06<\u002Fspan>\n        <span><span style=\"display:block;color:#eaf0ff;font-weight:600;font-size:15px;\">Ghi nhớ nhanh<\u002Fspan><span style=\"display:block;color:#7c88ad;font-size:12px;\">Tóm tắt bài học<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ MODULE 01: KHÁI NIỆM ============ -->\n  <section id=\"khai-niem\" data-screen-label=\"01 Khái niệm\" style=\"scroll-margin-top:90px;max-width:1120px;margin:0 auto;padding:50px 24px;border-top:1px solid rgba(255,255,255,.07);\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:var(--accent);\">MODULE 01<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(28px,4vw,40px);font-weight:800;margin:0 0 6px;letter-spacing:-.5px;\">Web Server là gì?<\u002Fh2>\n    <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:15px;color:#7c88ad;margin:0 0 30px;font-style:italic;\">What is a web server?<\u002Fp><\u002Fsc-if>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:30px;align-items:flex-start;\">\n      <div style=\"flex:1 1 420px;min-width:300px;display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"padding:22px;border-radius:16px;background:linear-gradient(160deg,rgba(59,130,246,.1),rgba(139,92,246,.05));border:1px solid rgba(59,130,246,.25);\">\n          <p style=\"margin:0;font-size:17px;line-height:1.7;color:#dbe3fa;\"><strong style=\"color:#fff;\">Web server<\u002Fstrong> là phần mềm máy chủ dùng để <strong style=\"color:var(--accent);\">chứa và phục vụ các trang web<\u002Fstrong> cho người dùng. Nó nhận yêu cầu từ trình duyệt, xử lý rồi trả về kết quả.<\u002Fp>\n        <\u002Fdiv>\n        <ul style=\"list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;\">\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;color:#c3ccea;\"><span style=\"flex:none;margin-top:3px;color:var(--accent);\">▹<\u002Fspan><span>Là <strong>phần mềm máy chủ<\u002Fstrong> được cài trên server để xử lý yêu cầu từ các trình duyệt (Chrome, Firefox, Safari, Edge).<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;color:#c3ccea;\"><span style=\"flex:none;margin-top:3px;color:var(--accent);\">▹<\u002Fspan><span>Chạy được trên nhiều hệ điều hành: <strong>Windows, Linux, Unix<\u002Fstrong>.<\u002Fspan><\u002Fli>\n          <li style=\"display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.6;color:#c3ccea;\"><span style=\"flex:none;margin-top:3px;color:var(--accent);\">▹<\u002Fspan><span>Phục vụ file <strong>HTML, CSS, JavaScript, hình ảnh<\u002Fstrong> và cả tài nguyên đa phương tiện (video, âm thanh…).<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- analogy card -->\n      <div style=\"flex:1 1 320px;min-width:280px;padding:26px;border-radius:20px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;\">💡 Ví dụ dễ hiểu<\u002Fdiv>\n        <p style=\"margin:0 0 14px;font-size:15px;line-height:1.7;color:#d3dbf5;\">Hãy tưởng tượng web server như một <strong style=\"color:#fff;\">nhân viên phục vụ nhà hàng<\u002Fstrong>:<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:12px;\">\n          <div style=\"display:flex;gap:12px;align-items:center;\"><span style=\"width:34px;height:34px;flex:none;border-radius:9px;background:rgba(59,130,246,.18);display:flex;align-items:center;justify-content:center;font-size:16px;\">🧑<\u002Fspan><span style=\"font-size:14px;color:#c3ccea;\">Khách (trình duyệt) <strong>gọi món<\u002Fstrong> = gửi yêu cầu<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;\"><span style=\"width:34px;height:34px;flex:none;border-radius:9px;background:rgba(139,92,246,.18);display:flex;align-items:center;justify-content:center;font-size:16px;\">🧾<\u002Fspan><span style=\"font-size:14px;color:#c3ccea;\">Nhân viên (web server) <strong>xử lý yêu cầu<\u002Fstrong><\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;\"><span style=\"width:34px;height:34px;flex:none;border-radius:9px;background:rgba(52,211,153,.18);display:flex;align-items:center;justify-content:center;font-size:16px;\">🍽️<\u002Fspan><span style=\"font-size:14px;color:#c3ccea;\">Mang món ra (trang web) = <strong>trả kết quả<\u002Fstrong><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- HOW IT WORKS DIAGRAM (native) -->\n    <div style=\"margin-top:40px;\">\n      <h3 style=\"font-size:20px;font-weight:700;margin:0 0 4px;\">Cách hoạt động: Request → Response<\u002Fh3>\n      <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:13px;color:#7c88ad;margin:0 0 22px;font-style:italic;\">How it works: the request–response cycle<\u002Fp><\u002Fsc-if>\n\n      <div class=\"ws-scroll\" style=\"overflow-x:auto;\">\n      <div style=\"min-width:640px;display:flex;align-items:stretch;gap:0;padding:8px 0;\">\n        <!-- browser -->\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;\">\n          <div style=\"width:88px;height:88px;border-radius:20px;background:linear-gradient(160deg,rgba(59,130,246,.22),rgba(59,130,246,.06));border:1px solid rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(59,130,246,.25);\">\n            <svg width=\"42\" height=\"42\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"14\" rx=\"2\" stroke=\"#93c5fd\" stroke-width=\"1.6\"><\u002Frect><path d=\"M3 8h18\" stroke=\"#93c5fd\" stroke-width=\"1.6\"><\u002Fpath><path d=\"M9 21h6M12 18v3\" stroke=\"#93c5fd\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><circle cx=\"5.5\" cy=\"6\" r=\".6\" fill=\"#93c5fd\"><\u002Fcircle><circle cx=\"7.5\" cy=\"6\" r=\".6\" fill=\"#93c5fd\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-weight:700;font-size:15px;color:#eaf0ff;\">Trình duyệt<\u002Fdiv>\n          <div style=\"font-size:12px;color:#7c88ad;\">Web Browser<\u002Fdiv>\n        <\u002Fdiv>\n        <!-- arrows column -->\n        <div style=\"flex:1.4;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 6px;\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:11px;letter-spacing:1px;color:#93c5fd;font-family:'Space Grotesk',sans-serif;text-align:center;\">HTTP REQUEST →<\u002Fspan>\n            <svg width=\"100%\" height=\"14\" viewBox=\"0 0 200 14\" preserveAspectRatio=\"none\"><line x1=\"0\" y1=\"7\" x2=\"188\" y2=\"7\" stroke=\"#3b82f6\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\" style=\"animation:dashflow 1s linear infinite\"><\u002Fline><path d=\"M188 2l8 5-8 5\" fill=\"none\" stroke=\"#3b82f6\" stroke-width=\"2.5\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:11px;color:#8b9bc7;text-align:center;\">\"Cho tôi trang web này\"<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:11px;letter-spacing:1px;color:#c4b5fd;font-family:'Space Grotesk',sans-serif;text-align:center;\">← HTTP RESPONSE<\u002Fspan>\n            <svg width=\"100%\" height=\"14\" viewBox=\"0 0 200 14\" preserveAspectRatio=\"none\"><line x1=\"12\" y1=\"7\" x2=\"200\" y2=\"7\" stroke=\"#8b5cf6\" stroke-width=\"2.5\" stroke-dasharray=\"8 6\" style=\"animation:dashflow 1s linear infinite reverse\"><\u002Fline><path d=\"M12 2l-8 5 8 5\" fill=\"none\" stroke=\"#8b5cf6\" stroke-width=\"2.5\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:11px;color:#8b9bc7;text-align:center;\">Trả về HTML, CSS, ảnh…<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <!-- server -->\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;\">\n gba(255,255,255,.1);\">\n      <h3 style=\"font-size:18px;font-weight:700;margin:0 0 4px;\">Toàn cảnh: từ tên miền đến trang web<\u002Fh3>\n      <p style=\"font-size:13px;color:#8b9bc7;margin:0 0 20px;\">Khi bạn gõ <code style=\"font-family:'JetBrains Mono',monospace;color:#93c5fd;background:rgba(59,130,246,.14);padding:2px 7px;border-radius:6px;\">example.com<\u002Fcode>, điều gì xảy ra?<\u002Fp>\n      <div class=\"ws-scroll\" style=\"overflow-x:auto;\"><div style=\"min-width:680px;display:flex;align-items:center;gap:10px;\">\n        <div style=\"flex:1;text-align:center;padding:14px 8px;border-radius:14px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.28);\"><div style=\"font-size:26px;\">🧑‍💻<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:6px;\">User<\u002Fdiv><div style=\"font-size:11px;color:#7c88ad;\">gõ tên miền<\u002Fdiv><\u002Fdiv>\n        <div style=\"color:var(--accent);font-size:20px;\">→<\u002Fdiv>\n        <div style=\"flex:1;text-align:center;padding:14px 8px;border-radius:14px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.28);\"><div style=\"font-size:26px;\">🌐<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:6px;\">DNS Server<\u002Fdiv><div style=\"font-size:11px;color:#7c88ad;\">tên → IP<\u002Fdiv><\u002Fdiv>\n        <div style=\"color:var(--accent2);font-size:20px;\">→<\u002Fdiv>\n        <div style=\"flex:1;text-align:center;padding:14px 8px;border-radius:14px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.28);\"><div style=\"font-size:26px;\">🖥️<\u002Fdiv><div style=\"font-size:13px;font-weight:600;margin-top:6px;\">Web Server<\u002Fdiv><div style=\"font-size:11px;color:#7c88ad;\">tại IP đó<\u002Fdiv><\u002Fdiv>\n        <div style=\"color:#34d399;font-size:20px;\">→<\u002Fdiv>\n        <div style=\"flex:1;text-align:center;padding:14px 8px;border-radius:14px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.28);\"><div style=\"font-size:2 :grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;\">\n      <div style=\"padding:24px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:14px;\" style-hover=\"border-color:rgba(59,130,246,.5);transform:translateY(-4px);\">\n        <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(59,130,246,.3),rgba(59,130,246,.08));border:1px solid rgba(59,130,246,.4);display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"1.5\" stroke=\"#93c5fd\" stroke-width=\"1.8\"><\u002Frect><path d=\"M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3\" stroke=\"#93c5fd\" stroke-width=\"1.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div><div style=\"font-weight:700;font-size:16px;color:#fff;\">Server Hardware<\u002Fdiv><div style=\"font-size:12px;color:var(--accent);font-family:'Space Grotesk',sans-serif;\">Phần cứng<\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Thiết bị vật lý chứa các thành phần phần cứng của máy chủ (CPU, RAM, ổ cứng…).<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:14px;\" style-hover=\"border-color:rgba(139,92,246,.5);transform:translateY(-4px);\">\n        <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(139,92,246,.08));border:1px solid rgba(139,92,246,.4);display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14\" stroke=\"#c4b5fd\" st ,255,.1);display:flex;flex-direction:column;gap:14px;\" style-hover=\"border-color:rgba(251,191,36,.5);transform:translateY(-4px);\">\n        <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.3),rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.4);display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><ellipse cx=\"12\" cy=\"6\" rx=\"7\" ry=\"3\" stroke=\"#fcd34d\" stroke-width=\"1.8\"><\u002Fellipse><path d=\"M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6\" stroke=\"#fcd34d\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div><div style=\"font-weight:700;font-size:16px;color:#fff;\">Database<\u002Fdiv><div style=\"font-size:12px;color:#fbbf24;font-family:'Space Grotesk',sans-serif;\">Cơ sở dữ liệu<\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Đi kèm để lưu trữ và quản lý dữ liệu của website (tài khoản, bài viết, đơn hàng…).<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"padding:24px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:14px;\" style-hover=\"border-color:rgba(244,114,182,.5);transform:translateY(-4px);\">\n        <div style=\"width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(244,114,182,.3),rgba(244,114,182,.08));border:1px solid rgba(244,114,182,.4);display:flex;align-items:center;justify-content:center;\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#f9a8d4\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M3 12h18M12 3c2.5 2.5 3.8 5.8 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.8-3.8-9S9.5 5.5 12 3z\" stroke=\"#f9a8d4\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div><div style=\"font-weight:700;font-size:16px;color:#fff;\">Domain + IP Public<\u002Fdiv><div style=\"font-size:12px;color:#f472b6;font-family:'Space Grotesk',sans-serif;\">Tên miền &amp; IP<\u002Fdiv><\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Cần khi muốn <strong>public website ra Internet<\u002Fstrong> để mọi người truy cập được.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ MODULE 03: PHỔ BIẾN ============ -->\n  <section id=\"pho-bien\" data-screen-label=\"03 Phổ biến\" style=\"scroll-margin-top:90px;max-width:1120px;margin:0 auto;padding:50px 24px;border-top:1px solid rgba(255,255,255,.07);\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:var(--accent);\">MODULE 03<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(28px,4vw,40px);font-weight:800;margin:0 0 6px;letter-spacing:-.5px;\">Một số Web Server phổ biến<\u002Fh2>\n    <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:15px;color:#7c88ad;margin:0 0 30px;font-style:italic;\">Popular web servers<\u002Fp><\u002Fsc-if>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;\">\n      <!-- Apache -->\n      <div style=\"border-radius:20px;overflow:hidden;border:1px solid rgba(239,68,68,.3);background:rgba(255,255,255,.03);\">\n        <div style=\"padding:20px 22px;background:linear-gradient(135deg,rgba(239,68,68,.28),rgba(239,68,68,.06));display:flex;align-items:center;gap:14px;\">\n          <div style=\"width:48px;height:48px;border-radius:12px;background:#ef4444;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:#fff;box-shadow:0 8px 20px rgba(239,68,68,.4);\">A<\u002Fdiv>\n          <div><div style=\"font-weight:800;font-size:18px;color:#fff;\">Apache<\u002Fdiv><div style=\"font-size:12px;color:#fca5a5;\">HTTP Server<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:12px;\">\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#c3ccea;\">Web server mã nguồn mở lâu đời, linh hoạt với hệ thống module đồ sộ.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(239,68,68,.14);color:#fca5a5;\">Mã nguồn mở<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">Đa nền tảng<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">Nhiều module<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8b9bc7;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;\">✅ Hợp với: <strong style=\"color:#dbe3fa;\">web động<\u002Fstrong> — WordPress, Drupal, Joomla<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Nginx -->\n      <div style=\"border-radius:20px;overflow:hidden;border:1px solid rgba(16,185,129,.3);background:rgba(255,255,255,.03);\">\n        <div style=\"padding:20px 22px;background:linear-gradient(135deg,rgba(16,185,129,.28),rgba(16,185,129,.06));display:flex;align-items:center;gap:14px;\">\n          <div style=\"width:48px;height:48px;border-radius:12px;background:#10b981;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.4);\">N<\u002Fdiv>\n          <div><div style=\"font-weight:800;font-size:18px;color:#fff;\">Nginx<\u002Fdiv><div style=\"font-size:12px;color:#6ee7b7;\">engine-x<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:12px;\">\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#c3ccea;\">Kiến trúc event-driven, non-blocking — xử lý cực nhanh khi tải cao.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(16,185,129,.14);color:#6ee7b7;\">Hiệu suất cao<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">Nhẹ<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">Load balancing<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8b9bc7;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;\">✅ Hợp với: <strong style=\"color:#dbe3fa;\">web tĩnh, REST API<\u002Fstrong>, hệ thống tải cao<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- IIS -->\n      <div style=\"border-radius:20px;overflow:hidden;border:1px solid rgba(59,130,246,.3);background:rgba(255,255,255,.03);\">\n        <div style=\"padding:20px 22px;background:linear-gradient(135deg,rgba(59,130,246,.28),rgba(59,130,246,.06));display:flex;align-items:center;gap:14px;\">\n          <div style=\"width:48px;height:48px;border-radius:12px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.4);\">IIS<\u002Fdiv>\n          <div><div style=\"font-weight:800;font-size:18px;color:#fff;\">Microsoft IIS<\u002Fdiv><div style=\"font-size:12px;color:#93c5fd;\">Internet Info Services<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px 22px;display:flex;flex-direction:column;gap:12px;\">\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#c3ccea;\">Web server của Microsoft, tích hợp sâu vào Windows với giao diện quản lý trực quan.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(59,130,246,.14);color:#93c5fd;\">Có GUI<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">Chỉ Windows<\u002Fspan>\n            <span style=\"font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.06);color:#aab4d4;\">ASP.NET<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#8b9bc7;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;\">✅ Hợp với: <strong style=\"color:#dbe3fa;\">doanh nghiệp<\u002Fstrong> dùng hệ sinh thái Microsoft<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ MODULE 04: SO SÁNH ============ -->\n  <section id=\"so-sanh\" data-screen-label=\"04 So sánh\" style=\"scroll-margin-top:90px;max-width:1120px;margin:0 auto;padding:50px 24px;border-top:1px solid rgba(255,255,255,.07);\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:var(--accent);\">MODULE 04<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(28px,4vw,40px);font-weight:800;margin:0 0 6px;letter-spacing:-.5px;\">So sánh chi tiết<\u002Fh2>\n    <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:15px;color:#7c88ad;margin:0 0 26px;font-style:italic;\">Detailed comparison: Apache vs Nginx vs IIS<\u002Fp><\u002Fsc-if>\n\n    <div class=\"ws-scroll\" style=\"overf        <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Nhà phát triển<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Apache Software Foundation<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Igor Sysoev<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Microsoft<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Hệ điều hành<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Đa nền tảng (Linux, Windows, macOS)<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Đa nền tảng (Linux, Windows, macOS)<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Chỉ Windows<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Giấy phép<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Mã nguồn mở (Apache 2.0)<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Mã nguồn mở (BSD)<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Đóng nguồn<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Kiến trúc xử lý<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Process / Thread-based<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Event-driven, non-blocking<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Thread-pool (mô hình Windows)<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Hiệu suất<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Tốt với tải vừa<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Rất tốt với tải cao<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Tốt trong môi trường Windows<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Nội dung tĩnh<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Tốt<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Rất tốt, tối ưu cao<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Tốt<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">Caching<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Có (qua module)<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Proxy caching mạnh mẽ<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-height:1.5;\">Tích hợp caching<\u002Ftd><\u002Ftr>\n          <tr style=\"border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);\"><td style=\"padding:13px 18px;color:#dbe3fa;font-weight:600;vertical-align:top;\">SSL / TLS<\u002Ftd><td style=\"padding:13px 18px;color:#aab4d4;vertical-align:top;line-h u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <p style=\"font-size:12px;color:#5f6a8a;margin:14px 0 0;\">↔ Vuốt ngang để xem đầy đủ bảng · Swipe horizontally to see the full table<\u002Fp>\n  <\u002Fsection>\n\n  <!-- ============ MODULE 05: THỰC HÀNH ============ -->\n  <section id=\"thuc-hanh\" data-screen-label=\"05 Thực hành\" style=\"scroll-margin-top:90px;max-width:1120px;margin:0 auto;padding:50px 24px;border-top:1px solid rgba(255,255,255,.07);\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:var(--accent);\">MODULE 05<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(28px,4vw,40px);font-weight:800;margin:0 0 6px;letter-spacing:-.5px;\">Thực hành<\u002Fh2>\n    <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:15px;color:#7c88ad;margin:0 0 24px;font-style:italic;\">Hands-on: install a web server &amp; deploy a page<\u002Fp><\u002Fsc-if>\n\n    <!-- goal chips -->\n    <div style=\"display:flex;flex-wrap:wrap;gap:12px;margin-bottom:26px;\">\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#c3ccea;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);\"><span style=\"color:var(--accent);\">◆<\u002Fspan> Cài đặt IIS<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#c3ccea;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);\"><span style=\"color:#10b981;\">◆<\u002Fspan> Cài đặt Nginx<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:#c3ccea;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);\"><span style=\"color:var(--accent2);\">◆<\u002Fspan> Tạo index.html &amp; deploy<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- tabs -->\n    <div style=\"display:flex;gap:8px;margin-bottom:18px;\">\n      <button onclick=\"{{ setIIS }}\" style=\"{{ iisTabStyle }}\">🪟 Cài IIS (Windows)<\u002Fbutton>\n      <button onclick=\"{{ setNginx }}\" style=\"{{ nginxTabStyle }}\">🐧 Cài Nginx (Linux)<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- IIS steps -->\n    <sc-if value=\"{{ isIIS }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">1<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Mở Windows Features<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Vào <em>Control Panel → Programs → Turn Windows features on or off<\u002Fem>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">2<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Bật IIS<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Tích chọn <strong style=\"color:#dbe3fa;\">Internet Information Services<\u002Fstrong> → nhấn <strong>OK<\u002Fstrong> và chờ cài đặt.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">3<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Kiểm tra<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Mở trình duyệt, truy cập <code style=\"font-family:'JetBrains Mono',monospace;color:#93c5fd;background:rgba(59,130,246,.14);padding:1px 6px;border-radius:5px;\">http://localhost<\u002Fcode> → thấy trang chào mừng IIS là thành công.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">4<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Thư mục web<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Đặt file website vào <code style=\"font-family:'JetBrains Mono',monospace;color:#93c5fd;background:rgba(59,130,246,.14);padding:1px 6px;border-radius:5px;\">C:\\inetpub\\wwwroot<\u002Fcode>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Nginx steps -->\n    <sc-if value=\"{{ isNginx }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:#10b981;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">1<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Cài đặt<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Trên Ubuntu/Debian chạy: <code style=\"font-family:'JetBrains Mono',monospace;color:#6ee7b7;background:rgba(16,185,129,.14);padding:1px 6px;border-radius:5px;\">sudo apt install nginx<\u002Fcode><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:#10b981;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">2<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Khởi động<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\"><code style=\"font-family:'JetBrains Mono',monospace;color:#6ee7b7;background:rgba(16,185,129,.14);padding:1px 6px;border-radius:5px;\">sudo systemctl start nginx<\u002Fcode> (Windows: chạy <code style=\"font-family:'JetBrains Mono',monospace;color:#6ee7b7;background:rgba(16,185,129,.14);padding:1px 6px;border-radius:5px;\">nginx.exe<\u002Fcode>).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:#10b981;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">3<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Kiểm tra<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Truy cập <code style=\"font-family:'JetBrains Mono',monospace;color:#6ee7b7;background:rgba(16,185,129,.14);padding:1px 6px;border-radius:5px;\">http://localhost<\u002Fcode> → thấy trang \"Welcome to nginx!\".<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:rgba(16,185,129,.07);border:1px solid rgba(16,185,129,.22);\"><span style=\"flex:none;width:30px;height:30px;border-radius:9px;background:#10b981;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px;\">4<\u002Fspan><div><div style=\"font-weight:600;color:#eaf0ff;margin-bottom:3px;\">Thư mục web<\u002Fdiv><div style=\"font-size:14px;color:#aab4d4;line-height:1.6;\">Đặt file website vào <code style=\"font-family:'JetBrains Mono',monospace;color:#6ee7b7;background:rgba(16,185,129,.14);padding:1px 6px;border-radius:5px;\">/var/www/html<\u002Fcode>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- deploy code -->\n    <div style=\"margin-top:30px;\">\n      <h3 style=\"font-size:19px;font-weight:700;margin:0 0 4px;\">Tạo <code style=\"font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--accent2);\">index.html<\u002Fcode> &amp; deploy<\u002Fh3>\n      <p style=\"font-size:13px;color:#8b9bc7;margin:0 0 16px;\">Tạo file HTML đơn giản rồi copy vào thư mục web của server.<\u002Fp>\n      <div style=\"border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#0a0e1c;\">\n        <div style=\"display:flex;align-items:center;gap:8px;padding:11px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.08);\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#f87171;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#fbbf24;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#34d399;\"><\u002Fspan>\n          <span style=\"margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8b9bc7;\">index.html<\u002Fspan>\n        <\u002Fdiv>\n        <pre style=\"margin:0;padding:20px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;color:#c9d4f5;\"><span style=\"color:#6272a4;\">&lt;!DOCTYPE html&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;html<\u002Fspan> <span style=\"color:#50fa7b;\">lang<\u002Fspan>=<span style=\"color:#f1fa8c;\">\"en\"<\u002Fspan><span style=\"color:#ff79c6;\">&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;head&gt;<\u002Fspan>\n    <span style=\"color:#ff79c6;\">&lt;meta<\u002Fspan> <span style=\"color:#50fa7b;\">charset<\u002Fspan>=<span style=\"color:#f1fa8c;\">\"UTF-8\"<\u002Fspan><span style=\"color:#ff79c6;\">&gt;<\u002Fspan>\n    <span style=\"color:#ff79c6;\">&lt;meta<\u002Fspan> <span style=\"color:#50fa7b;\">name<\u002Fspan>=<span style=\"color:#f1fa8c;\">\"viewport\"<\u002Fspan> <span style=\"color:#50fa7b;\">content<\u002Fspan>=<span style=\"color:#f1fa8c;\">\"width=device-width, initial-scale=1.0\"<\u002Fspan><span style=\"color:#ff79c6;\">&gt;<\u002Fspan>\n    <span style=\"color:#ff79c6;\">&lt;title&gt;<\u002Fspan>Simple Web Page<span style=\"color:#ff79c6;\">&lt;/title&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;/head&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;body&gt;<\u002Fspan>\n    <span style=\"color:#ff79c6;\">&lt;h1&gt;<\u002Fspan>Welcome to SA Pro Class<span style=\"color:#ff79c6;\">&lt;/h1&gt;<\u002Fspan>\n    <span style=\"color:#ff79c6;\">&lt;p&gt;<\u002Fspan>This is a simple HTML page deployed on a web server.<span style=\"color:#ff79c6;\">&lt;/p&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;/body&gt;<\u002Fspan>\n<span style=\"color:#ff79c6;\">&lt;/html&gt;<\u002Fspan><\u002Fpre>\n      <\u002Fdiv>\n      <!-- browser preview -->\n      <div style=\"margin-top:16px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);\">\n        <div style=\"display:flex;align-items:center;gap:10px;padding:10px 14px;background:#1a2033;\">\n          <span style=\"width:11px;height:11px;border-radius:50%;background:#f87171;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#fbbf24;\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#34d399;\"><\u002Fspan>\n          <div style=\"flex:1;background:#0d1120;border-radius:7px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8b9bc7;\">🔒 http://localhost/index.html<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;color:#111;padding:28px 26px;\">\n          <h1 style=\"margin:0 0 12px;font-family:'Times New Roman',serif;font-size:30px;font-weight:700;color:#000;\">Welcome to SA Pro Class<\u002Fh1>\n          <p style=\"margin:0;font-family:'Times New Roman',serif;font-size:16px;color:#222;\">This is a simple HTML page deployed on a web server.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:rgba(52,211,153,.1);border-top:1px solid rgba(52,211,153,.25);padding:10px 16px;font-size:12px;color:#6ee7b7;\">✅ Kết quả khi truy cập trang qua web server<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ MODULE 06: TÓM TẮT ============ -->\n  <section id=\"tom-tat\" data-screen-label=\"06 Tóm tắt\" style=\"scroll-margin-top:90px;max-width:1120px;margin:0 auto;padding:50px 24px;border-top:1px solid rgba(255,255,255,.07);\">\n    <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:8px;\">\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:3px;color:var(--accent2);\">MODULE 06<\u002Fspan>\n      <span style=\"flex:1;height:1px;background:linear-gradient(90deg,var(--accent2),transparent);\"><\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-size:clamp(28px,4vw,40px);font-weight:800;margin:0 0 26px;letter-spacing:-.5px;\">Ghi nhớ nhanh<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;\">\n      <div style=\"padding:22px;border-radius:16px;background:linear-gradient(160deg,rgba(59,130,246,.12),transparent);border:1px solid rgba(59,130,246,.25);\"><div style=\"font-size:26px;margin-bottom:10px;\">🖥️<\u002Fdiv><div style=\"font-weight:700;color:#fff;margin-bottom:6px;\">Web server là gì<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Phần mềm máy chủ nhận yêu cầu HTTP từ trình duyệt và trả về trang web.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:22px;border-radius:16px;background:linear-gradient(160deg,rgba(139,92,246,.12),transparent);border:1px solid rgba(139,92,246,.25);\"><div style=\"font-size:26px;margin-bottom:10px;\">🧩<\u002Fdiv><div style=\"font-weight:700;color:#fff;margin-bottom:6px;\">5 thành phần<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Hardware · Software · API · Database · Domain + IP Public.<\u002Fp><\u002Fdiv>\n      <div style=\"padding:22px;border-radius:16px;background:linear-gradient(160deg,rgba(16,185,129,.12),transparent);border:1px solid rgba(16,185,129,.25);\"><div style=\"font-size:26px;margin-bottom:10px;\">⚖️<\u002Fdiv><div style=\"font-weight:700;color:#fff;margin-bottom:6px;\">3 lựa chọn<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Apache (linh hoạt) · Nginx (tốc độ) · IIS (Windows).<\u002Fp><\u002Fdiv>\n      <div style=\"padding:22px;border-radius:16px;background:linear-gradient(160deg,rgba(251,191,36,.12),transparent);border:1px solid rgba(251,191,36,.25);\"><div style=\"font-size:26px;margin-bottom:10px;\">🚀<\u002Fdiv><div style=\"font-weight:700;color:#fff;margin-bottom:6px;\">Deploy<\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.6;color:#aab4d4;\">Tạo index.html → copy vào thư mục web root → truy cập localhost.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Q&A -->\n    <div style=\"margin-top:30px;padding:30px;border-radius:20px;background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(139,92,246,.14));border:1px solid rgba(139,92,246,.3);text-align:center;\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;color:#fff;letter-spacing:1px;\">Q &amp; A<\u002Fdiv>\n      <p style=\"margin:8px 0 0;color:#c3ccea;font-size:15px;\">Cảm ơn bạn đã hoàn thành module · Thanks for completing the module!<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"max-width:1120px;margin:0 auto;padding:34px 24px 60px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;\">\n    <div style=\"display:flex;align-items:center;gap:12px;\">\n      <div style=\"width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff;\">YN<\u002Fdiv>\n      <div><div style=\"font-weight:700;color:#eaf0ff;font-size:14px;\">Yên Nguyễn<\u002Fdiv><div style=\"font-size:12px;color:#7c88ad;\">Lesson 17 — Web Server · Module tự học<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:#5f6a8a;text-align:right;\">© 2026 Yên Nguyễn · All Rights Reserved<\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:760},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Xanh dương&quot;,&quot;Tím&quot;,&quot;Cyan&quot;],&quot;default&quot;:&quot;Xanh dương&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Giao diện&quot;},&quot;showEnglish&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Nội dung&quot;},&quot;showOriginalImages&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Nội dung&quot;}}\">\nclass Component extends DCLogic {\n  state = { progress: 0, tab: 'iis' };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      const doc = document.documentElement;\n      const st = window.scrollY || doc.scrollTop || 0;\n      const h = (doc.scrollHeight - doc.clientHeight) || 1;\n      this.setState({ progress: Math.max(0, Math.min(100, (st / h) * 100)) });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._onScroll();\n    this.applyAccent();\n  }\n  componentDidUpdate(prev) {\n    if (prev.accent !== this.props.accent) this.applyAccent();\n  }\n  componentWillUnmount() {\n    if (this._onScroll) window.removeEventListener('scroll', this._onScroll);\n  }\n  applyAccent() {\n    const map = {\n      'Xanh dương': ['#3b82f6', '#8b5cf6'],\n      'Tím': ['#8b5cf6', '#6366f1'],\n      'Cyan': ['#22d3ee', '#3b82f6'],\n    };\n    const a = map[this.props.accent] || map['Xanh dương'];\n    const r = document.documentElement;\n    r.style.setProperty('--accent', a[0]);\n    r.style.setProperty('--accent2', a[1]);\n  }\n  go(id) {\n    const el = document.getElementById(id);\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 78, behavior: 'smooth' });\n  }\n  renderVals() {\n    const isIIS = this.state.tab === 'iis';\n    const tabBase = \"font-family:'Be Vietnam Pro',sans-serif;font-weight:600;font-size:14px;padding:11px 20px;border-radius:11px;cursor:pointer;transition:all .15s;\";\n    return {\n      progress: this.state.progress + '%',\n      showEnglish: this.props.showEnglish ?? true,\n      showImgs: this.props.showOriginalImages ?? true,\n      isIIS,\n      isNginx: !isIIS,\n      setIIS: () => this.setState({ tab: 'iis' }),\n      setNginx: () => this.setState({ tab: 'nginx' }),\n      iisTabStyle: tabBase + (isIIS\n        ? 'color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));border:1px solid transparent;box-shadow:0 8px 22px rgba(59,130,246,.4);'\n        : 'color:#aab4d4;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);'),\n      nginxTabStyle: tabBase + (!isIIS\n        ? 'color:#fff;background:linear-gradient(135deg,#10b981,#059669);border:1px solid transparent;box-shadow:0 8px 22px rgba(16,185,129,.4);'\n        : 'color:#aab4d4;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);'),\n      goKhai: () => this.go('khai-niem'),\n      goThanhPhan: () => this.go('thanh-phan'),\n      goPhoBien: () => this.go('pho-bien'),\n      goSoSanh: () => this.go('so-sanh'),\n      goThucHanh: () => this.go('thuc-hanh'),\n      goTomTat: () => this.go('tom-tat'),\n      compareRows: [\n        { k: 'Nhà phát triển', a: 'Apache Software Foundation', n: 'Igor Sysoev', i: 'Microsoft' },\n        { k: 'Hệ điều hành', a: 'Đa nền tảng (Linux, Windows, macOS)', n: 'Đa nền tảng (Linux, Windows, macOS)', i: 'Chỉ Windows' },\n        { k: 'Giấy phép', a: 'Mã nguồn mở (Apache 2.0)', n: 'Mã nguồn mở (BSD)', i: 'Đóng nguồn' },\n        { k: 'Kiến trúc xử lý', a: 'Process / Thread-based', n: 'Event-driven, non-blocking', i: 'Thread-pool (mô hình Windows)' },\n        { k: 'Hiệu suất', a: 'Tốt với tải vừa', n: 'Rất tốt với tải cao', i: 'Tốt trong môi trường Windows' },\n        { k: 'Nội dung tĩnh', a: 'Tốt', n: 'Rất tốt, tối ưu cao', i: 'Tốt' },\n        { k: 'Caching', a: 'Có (qua module)', n: 'Proxy caching mạnh mẽ', i: 'Tích hợp caching' },\n        { k: 'SSL / TLS', a: 'Module mod_ssl', n: 'Tích hợp sẵn', i: 'Tích hợp trong Windows' },\n        { k: 'Load Balancing', a: 'Có (hiệu suất thấp hơn Nginx)', n: 'Hỗ trợ tốt, tối ưu', i: 'Tích hợp trên Windows' },\n        { k: 'Module hỗ trợ', a: 'Rất nhiều module mở rộng', n: 'Ít hơn, tập trung hiệu suất', i: 'Tích hợp với ASP.NET' },\n        { k:
