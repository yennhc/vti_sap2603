  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Be Vietnam Pro';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c79a025f-8b99-41f2-a488-a422ad614170\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  .ex { transition: opacity .2s; }\n  [data-hide-ex=\"hide\"] .ex { display: none !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div data-hide-ex=\"{{ rootData }}\" style=\"font-family:'Be Vietnam Pro',system-ui,sans-serif; background:radial-gradient(1200px 600px at 50% -10%, #1b2a4e 0%, #0e1730 55%, #0a0f24 100%); min-height:100vh; padding:0 0 80px; color:#0f172a;\">\n\n  <button onclick=\"{{ toggleEx }}\" style=\"position:fixed; top:20px; right:24px; z-index:50; border:none; cursor:pointer; padding:11px 18px; border-radius:999px; font-family:inherit; font-weight:600; font-size:14px; color:#fff; background:rgba(255,255,255,.12); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.25); box-shadow:0 4px 18px rgba(0,0,0,.25);\">{{ exLabel }}<\u002Fbutton>\n\n  <!-- HERO / ROOT -->\n  <header style=\"max-width:1360px; margin:0 auto; padding:64px 40px 28px; text-align:center; position:relative;\">\n    <div style=\"display:inline-flex; align-items:center; gap:9px; padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); color:#cdd9f5; font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;\">VTI Academy · An toàn mạng<\u002Fdiv>\n    <h1 style=\"margin:22px 0 0; font-size:62px; font-weight:800; line-height:1.02; letter-spacing:-.02em; color:#fff;\">Lesson 29 — <span style=\"background:linear-gradient(90deg,#fb923c,#f43f5e 45%,#a855f7 75%,#38bdf8); -webkit-background-clip:text; background-clip:text; color:transparent;\">Firewall &amp; IPS<\u002Fspan><\u002Fh1>\n    <p style=\"margin:18px auto 0; max-width:620px; font-size:18px; line-height:1.5; color:#aebede;\">Sơ đồ tư duy dạng module — hai trụ cột phòng thủ mạng: ngăn chặn ở vành đai (Firewall) và phát hiện &amp; chặn xâm nhập theo thời gian thực (IPS).<\u002Fp>\n    <div style=\"margin-top:34px; display:flex; justify-content:center;\">\n      <div style=\"display:inline-flex; align-items:center; gap:14px; padding:18px 30px; border-radius:20px; background:linear-gradient(135deg,#ffffff,#eef2ff); box-shadow:0 18px 50px rgba(56,189,248,.25); font-size:20px; font-weight:800; color:#0f172a;\"><span style=\"font-size:26px;\">🌐<\u002Fspan> An toàn &amp; Bảo mật mạng<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"width:2px; height:46px; margin:0 auto; background:linear-gradient(#cbd5f5,transparent);\"><\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- TWO BRANCHES -->\n  <div style=\"max-width:1360px; margin:0 auto; padding:0 40px; display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:start;\">\n\n    <!-- FIREWALL COLUMN -->\n    <section>\n      <div style=\"display:flex; align-items:center; gap:18px; padding:22px 26px; border-radius:22px; background:linear-gradient(135deg,#f97316,#ef4444 60%,#e11d48); box-shadow:0 16px 40px rgba(239,68,68,.4); position:sticky; top:16px; z-index:20;\">\n        <div style=\"width:58px; height:58px; flex:none; border-radius:16px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:30px;\">🔥<\u002Fdiv>\n        <div><div style=\"font-size:28px; font-weight:800; color:#fff; line-height:1;\">FIREWALL<\u002Fdiv><div style=\"font-size:14px; font-weight:500; color:#ffe4e0; margin-top:4px;\">Tường lửa · Hàng rào bảo vệ mạng<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-left:26px; margin-top:8px; border-left:3px dashed rgba(249,115,22,.55);\">\n        <div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#f97316; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(249,115,22,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#fb923c,#f97316);\">\n      <span style=\"font-size:22px;\">📖<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Định nghĩa<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"a5382ecb-6466-4a21-aca2-91c38c1c5938\" alt=\"Sơ đồ Firewall\" style=\"width:100%; height:170px; object-fit:contain; display:block; background:#f1f5f9; padding:10px;\">\n    <div style=\"padding:18px 20px;\">\n      <p style=\"margin:0 0 12px; font-size:14.5px; line-height:1.6; color:#334155;\"><b style=\"color:#ea580c;\">Firewall (Tường lửa)<\u002Fb> là hệ thống bảo mật mạng dùng để <b>giám sát, kiểm soát &amp; quản lý<\u002Fb> lưu lượng dữ liệu đi qua mạng dựa trên các quy tắc bảo mật định trước.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <div style=\"display:flex; gap:9px; font-size:13.5px; color:#475569;\"><span style=\"color:#f97316;\">●<\u002Fspan><span>Hàng rào bảo vệ — ngăn truy cập trái phép vào/ra mạng riêng tư.<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:9px; font-size:13.5px; color:#475569;\"><span style=\"color:#f97316;\">●<\u002Fspan><span>Có thể là <b>phần mềm, phần cứng<\u002Fb> hoặc kết hợp cả hai.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ex\" style=\"margin-top:12px; padding:10px 13px; border-radius:11px; background:#fff4ed; font-size:13px; color:#9a3412; display:flex; gap:8px; line-height:1.5;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Như bảo vệ ở cổng toà nhà — chỉ cho người có thẻ hợp lệ đi qua.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#f43f5e; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(244,63,94,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#fb7185,#f43f5e);\">\n      <span style=\"font-size:22px;\">⚙️<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Chức năng<\u002Fspan>\n      <span style=\"margin-left:auto; font-size:12px; font-weight:600; color:#fff; background:rgba(255,255,255,.22); padding:4px 10px; border-radius:999px;\">8 nhóm<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"5a845b21-4816-41f7-a75e-ffa7b6a952ed\" alt=\"Bảo mật mạng\" style=\"width:100%; height:160px; object-fit:cover; display:block;\">\n    <div style=\"padding:18px 20px; display:flex; flex-direction:column; gap:11px;\">\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">1 · Kiểm soát lưu lượng <span style=\"color:#94a3b8; font-weight:500;\">(Traffic Control)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Lọc gói tin theo <b>IP nguồn/đích<\u002Fb>, <b>port &amp; giao thức<\u002Fb> (TCP/UDP) và nội dung gói tin.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Chặn mọi gói tin tới port 23 (Telnet) vì không mã hoá.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">2 · Chống truy cập trái phép<\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Ngăn kết nối trái phép từ bên ngoài; chỉ nguồn được phép mới truy cập tài nguyên.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Chỉ cho dải IP văn phòng 192.168.1.0/24 vào máy chủ nội bộ.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">3 · Chống tấn công mạng <span style=\"color:#94a3b8; font-weight:500;\">(Cyberattack)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.55; margin-top:5px; display:flex; flex-direction:column; gap:4px;\">\n          <span><b style=\"color:#e11d48;\">DDoS:<\u002Fb> giới hạn số kết nối từ một nguồn để tránh quá tải.<\u002Fspan>\n          <span><b style=\"color:#e11d48;\">Port Scanning:<\u002Fb> chặn nỗ lực quét cổng tìm lỗ hổng.<\u002Fspan>\n          <span><b style=\"color:#e11d48;\">SQL Injection &amp; XSS:<\u002Fb> dùng Firewall ứng dụng (WAF).<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> WAF chặn request chứa <code style=\"background:#fee2e2; padding:1px 5px; border-radius:4px;\">' OR 1=1 --<\u002Fcode><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">4 · Lọc nội dung <span style=\"color:#94a3b8; font-weight:500;\">(Content Filtering)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Chặn theo <b>URL<\u002Fb> (web độc hại), từ khoá / loại tệp, địa chỉ IP hoặc miền.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Chặn nhân viên tải file .exe từ website lạ.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">5 · Ghi nhật ký &amp; giám sát <span style=\"color:#94a3b8; font-weight:500;\">(Logging)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Ghi các kết nối được cho phép/từ chối &amp; mối đe doạ — phục vụ phân tích, xử lý sự cố.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Log ghi 50 lần đăng nhập SSH thất bại từ 1 IP → cảnh báo brute-force.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">6 · Phân đoạn mạng <span style=\"color:#94a3b8; font-weight:500;\">(Segmentation)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Chia mạng nội bộ thành nhiều segment &amp; kiểm soát luồng giữa chúng để cô lập tấn công.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Tách VLAN máy chủ kế toán khỏi mạng Guest WiFi.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">7 · Kiểm tra trạng thái <span style=\"color:#94a3b8; font-weight:500;\">(Stateful Inspection)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Chỉ những gói tin thuộc một kết nối <b>hợp lệ<\u002Fb> mới được phép đi qua.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Cho phép gói reply chỉ khi đã có request đi ra trước đó.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#fef2f4; border-left:4px solid #f43f5e;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">8 · Bảo mật ứng dụng <span style=\"color:#94a3b8; font-weight:500;\">(App Security)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Kiểm tra lưu lượng ở cấp ứng dụng, phát hiện mã độc / khai thác lỗi.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#9f1239; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Application Firewall phát hiện mã độc giấu trong file ảnh upload.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#8b5cf6; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(139,92,246,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#a78bfa,#8b5cf6);\">\n      <span style=\"font-size:22px;\">🗂️<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Phân loại<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:18px 20px; display:flex; flex-direction:column; gap:14px;\">\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#7c3aed; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;\">▸ Theo vị trí triển khai<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:7px;\">\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Hardware:<\u002Fb> thiết bị vật lý giữa LAN &amp; internet — DN lớn <span style=\"color:#94a3b8;\">(Cisco ASA, FortiGate)<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Software:<\u002Fb> phần mềm trên thiết bị/máy chủ — cá nhân/nhỏ <span style=\"color:#94a3b8;\">(Windows Defender, iptables)<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Cloud-based:<\u002Fb> trên đám mây, bảo vệ dịch vụ trực tuyến <span style=\"color:#94a3b8;\">(AWS, Cloudflare)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#7c3aed; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;\">▸ Theo phương thức hoạt động<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:7px;\">\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Packet Filtering:<\u002Fb> lọc theo IP/port/giao thức — đơn giản nhất.<\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Stateful Inspection:<\u002Fb> theo dõi trạng thái kết nối.<\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Proxy / Application:<\u002Fb> trung gian, kiểm tra mức ứng dụng (HTTP, FTP).<\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#ede9fe; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">NGFW:<\u002Fb> stateful + kiểm tra nội dung + phát hiện đe doạ <span style=\"color:#94a3b8;\">(Palo Alto)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#7c3aed; text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;\">▸ Theo lớp bảo vệ (OSI)<\u002Fdiv>\n        <img src=\"2c59b950-8093-4601-aee8-71490f1b9935\" alt=\"Mô hình OSI\" style=\"width:100%; height:150px; object-fit:contain; background:#faf5ff; border-radius:10px; padding:6px; display:block; margin-bottom:8px;\">\n        <div style=\"display:flex; flex-direction:column; gap:7px;\">\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Network Layer:<\u002Fb> Layer 3 (IP) &amp; Layer 4 (TCP/UDP) — lọc IP/port/giao thức.<\u002Fdiv>\n          <div style=\"padding:9px 12px; border-radius:10px; background:#f5f3ff; font-size:13px; color:#334155; line-height:1.45;\"><b style=\"color:#6d28d9;\">Application Layer:<\u002Fb> Layer 7 — lọc theo nội dung/hành vi ứng dụng.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#10b981; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(16,185,129,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#34d399,#10b981);\">\n      <span style=\"font-size:22px;\">🔄<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Cách hoạt động<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"6fee8e73-9a24-48ac-b2b3-20febe5ab147\" alt=\"Lưu lượng qua Firewall\" style=\"width:100%; height:150px; object-fit:contain; background:#f0fdf4; padding:8px; display:block;\">\n    <div style=\"padding:18px 20px; display:flex; flex-direction:column; gap:12px;\">\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#ecfdf5; border-left:4px solid #10b981;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">Quy tắc bảo mật (Rules)<\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Kiểm tra gói tin theo IP nguồn/đích, port/giao thức, nội dung &amp; hành vi.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#047857; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Chặn toàn bộ lưu lượng đến từ một IP cụ thể.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#059669; margin-bottom:8px;\">Quyết định hành động<\u002Fdiv>\n        <div style=\"display:flex; gap:8px;\">\n          <div style=\"flex:1; text-align:center; padding:11px 6px; border-radius:11px; background:#dcfce7; color:#166534; font-weight:700; font-size:13px;\">✓ Allow<div style=\"font-weight:400; font-size:11px; color:#15803d; margin-top:2px;\">Cho phép<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; text-align:center; padding:11px 6px; border-radius:11px; background:#fee2e2; color:#991b1b; font-weight:700; font-size:13px;\">✕ Deny<div style=\"font-weight:400; font-size:11px; color:#b91c1c; margin-top:2px;\">Từ chối<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; text-align:center; padding:11px 6px; border-radius:11px; background:#dbeafe; color:#1e40af; font-weight:700; font-size:13px;\">▤ Log<div style=\"font-weight:400; font-size:11px; color:#1d4ed8; margin-top:2px;\">Ghi lại<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#059669; margin-bottom:8px;\">Lưu lượng vào / ra<\u002Fdiv>\n        <div style=\"display:flex; gap:8px;\">\n          <div style=\"flex:1; padding:10px 12px; border-radius:11px; background:#f0fdfa; font-size:12.5px; color:#334155; line-height:1.4;\"><b style=\"color:#0d9488;\">⬇ Inbound<\u002Fb><br>Dữ liệu từ ngoài vào mạng.<\u002Fdiv>\n          <div style=\"flex:1; padding:10px 12px; border-radius:11px; background:#f0fdfa; font-size:12.5px; color:#334155; line-height:1.4;\"><b style=\"color:#0d9488;\">⬆ Outbound<\u002Fb><br>Dữ liệu từ nội bộ ra ngoài.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#f59e0b; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(245,158,11,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#fbbf24,#f59e0b);\">\n      <span style=\"font-size:22px;\">🛠️<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Thực hành<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:18px 20px; display:flex; align-items:center; gap:16px;\">\n      <img src=\"1f0e58ec-1f19-48cd-9a7c-e0da587e8b02\" alt=\"Firewall\" style=\"width:110px; height:80px; flex:none; object-fit:contain; background:#fffbeb; border-radius:10px;\">\n      <div style=\"display:flex; flex-direction:column; gap:9px; flex:1;\">\n        <div style=\"display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:11px; background:#fffbeb; border-left:4px solid #f59e0b;\"><span style=\"width:24px; height:24px; flex:none; border-radius:50%; background:#f59e0b; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;\">1<\u002Fspan><span style=\"font-size:14px; font-weight:600; color:#0f172a;\">Cài đặt <b style=\"color:#d97706;\">pfSense<\u002Fb><\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:11px; background:#fffbeb; border-left:4px solid #f59e0b;\"><span style=\"width:24px; height:24px; flex:none; border-radius:50%; background:#f59e0b; color:#fff; font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;\">2<\u002Fspan><span style=\"font-size:14px; font-weight:600; color:#0f172a;\">Tạo <b style=\"color:#d97706;\">policy<\u002Fb> lọc lưu lượng<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- IPS COLUMN -->\n    <section>\n      <div style=\"display:flex; align-items:center; gap:18px; padding:22px 26px; border-radius:22px; background:linear-gradient(135deg,#6366f1,#3b82f6 55%,#06b6d4); box-shadow:0 16px 40px rgba(59,130,246,.4); position:sticky; top:16px; z-index:20;\">\n        <div style=\"width:58px; height:58px; flex:none; border-radius:16px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:30px;\">🛡️<\u002Fdiv>\n        <div><div style=\"font-size:28px; font-weight:800; color:#fff; line-height:1;\">IPS<\u002Fdiv><div style=\"font-size:14px; font-weight:500; color:#dbeafe; margin-top:4px;\">Intrusion Prevention System<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding-left:26px; margin-top:8px; border-left:3px dashed rgba(59,130,246,.55);\">\n        <div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#6366f1; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(99,102,241,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#818cf8,#6366f1);\">\n      <span style=\"font-size:22px;\">📖<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Định nghĩa<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"5b013f7d-d2c5-4d34-ad87-45429c7261e9\" alt=\"Intrusion Detected\" style=\"width:100%; height:170px; object-fit:cover; display:block;\">\n    <div style=\"padding:18px 20px;\">\n      <p style=\"margin:0 0 12px; font-size:14.5px; line-height:1.6; color:#334155;\"><b style=\"color:#4f46e5;\">IPS (Intrusion Prevention System)<\u002Fb> là hệ thống <b>phát hiện &amp; ngăn chặn xâm nhập<\u002Fb>, giám sát lưu lượng mạng/hoạt động hệ thống để phát hiện hành vi đáng ngờ hoặc mối đe doạ.<\u002Fp>\n      <div style=\"display:flex; gap:9px; font-size:13.5px; color:#475569; line-height:1.5;\"><span style=\"color:#6366f1;\">●<\u002Fspan><span>Sau khi phát hiện, IPS sẽ <b>chặn, giảm thiểu hoặc loại bỏ<\u002Fb> mối đe doạ <b>trước khi<\u002Fb> nó gây hại.<\u002Fspan><\u002Fdiv>\n      <div class=\"ex\" style=\"margin-top:12px; padding:10px 13px; border-radius:11px; background:#eef2ff; font-size:13px; color:#3730a3; display:flex; gap:8px; line-height:1.5;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Như hệ thống báo động tự khoá cửa ngay khi phát hiện kẻ trộm.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#3b82f6; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(59,130,246,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#60a5fa,#3b82f6);\">\n      <span style=\"font-size:22px;\">⚙️<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Chức năng<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"3fc18f86-f26a-4aab-82da-6053fcb4ff8e\" alt=\"Hack attempt failed\" style=\"width:100%; height:155px; object-fit:cover; display:block;\">\n    <div style=\"padding:18px 20px; display:flex; flex-direction:column; gap:11px;\">\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#eff6ff; border-left:4px solid #3b82f6;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">Phát hiện xâm nhập <span style=\"color:#94a3b8; font-weight:500;\">(Detection)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Phân tích lưu lượng / hoạt động hệ thống để phát hiện mẫu tấn công hoặc hành vi bất thường.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#eff6ff; border-left:4px solid #3b82f6;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">Ngăn chặn tấn công <span style=\"color:#94a3b8; font-weight:500;\">(Prevention)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.55; margin-top:5px; display:flex; flex-direction:column; gap:4px;\">\n          <span><b style=\"color:#2563eb;\">›<\u002Fb> Tự động chặn gói tin đáng ngờ.<\u002Fspan>\n          <span><b style=\"color:#2563eb;\">›<\u002Fb> Đóng kết nối nguy hiểm.<\u002Fspan>\n          <span><b style=\"color:#2563eb;\">›<\u002Fb> Cô lập thiết bị bị nhiễm.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#eff6ff; border-left:4px solid #3b82f6;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">Cảnh báo &amp; ghi nhật ký<\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Gửi cảnh báo đến quản trị viên &amp; ghi chi tiết để phân tích về sau.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#eff6ff; border-left:4px solid #3b82f6;\">\n        <div style=\"font-weight:700; font-size:14.5px; color:#0f172a;\">Hỗ trợ tuân thủ <span style=\"color:#94a3b8; font-weight:500;\">(Compliance)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;\">\n          <span style=\"padding:4px 10px; border-radius:999px; background:#dbeafe; color:#1e40af; font-weight:600; font-size:12px;\">PCI DSS<\u002Fspan>\n          <span style=\"padding:4px 10px; border-radius:999px; background:#dbeafe; color:#1e40af; font-weight:600; font-size:12px;\">HIPAA<\u002Fspan>\n          <span style=\"padding:4px 10px; border-radius:999px; background:#dbeafe; color:#1e40af; font-weight:600; font-size:12px;\">ISO 27001<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#14b8a6; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(20,184,166,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#2dd4bf,#14b8a6);\">\n      <span style=\"font-size:22px;\">🔄<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Cách hoạt động<\u002Fspan>\n    <\u002Fdiv>\n    <img src=\"2ddb5842-9846-4051-a233-b79e3302c0ac\" alt=\"Bảo mật\" style=\"width:100%; height:150px; object-fit:cover; display:block;\">\n    <div style=\"padding:18px 20px; display:flex; flex-direction:column; gap:11px;\">\n\n      <div style=\"padding:11px 14px; border-radius:12px; background:#f0fdfa; border-left:4px solid #14b8a6; font-size:13px; color:#334155; line-height:1.5;\"><b style=\"color:#0f766e;\">1 · Giám sát lưu lượng:<\u002Fb> kiểm tra mọi gói tin đi qua hệ thống mạng.<\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#f0fdfa; border-left:4px solid #14b8a6;\">\n        <div style=\"font-weight:700; font-size:14px; color:#0f172a;\">2 · So khớp mẫu <span style=\"color:#94a3b8; font-weight:500;\">(Signature-based)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">So sánh lưu lượng với CSDL các mẫu tấn công đã biết.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#0f766e; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Nhận diện chữ ký mã độc WannaCry.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px; border-radius:12px; background:#f0fdfa; border-left:4px solid #14b8a6;\">\n        <div style=\"font-weight:700; font-size:14px; color:#0f172a;\">3 · Phát hiện bất thường <span style=\"color:#94a3b8; font-weight:500;\">(Anomaly-based)<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px; color:#475569; line-height:1.5; margin-top:3px;\">Xác định hành vi khác thường so với hoạt động bình thường của mạng.<\u002Fdiv>\n        <div class=\"ex\" style=\"margin-top:7px; padding:7px 11px; border-radius:9px; background:#fff; font-size:12.5px; color:#0f766e; display:flex; gap:7px;\"><span>💡<\u002Fspan><span><b>Ví dụ:<\u002Fb> Lưu lượng tăng vọt bất thường lúc 3h sáng.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size:13px; font-weight:700; color:#0d9488; margin-bottom:8px;\">4 · Ngăn chặn mối đe doạ<\u002Fdiv>\n        <div style=\"display:flex; gap:7px;\">\n          <div style=\"flex:1; text-align:center; padding:10px 5px; border-radius:11px; background:#ccfbf1; color:#115e59; font-weight:700; font-size:12px;\">Drop<div style=\"font-weight:400; font-size:10.5px; margin-top:2px;\">Loại bỏ gói<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; text-align:center; padding:10px 5px; border-radius:11px; background:#ccfbf1; color:#115e59; font-weight:700; font-size:12px;\">Block<div style=\"font-weight:400; font-size:10.5px; margin-top:2px;\">Đóng kết nối<\u002Fdiv><\u002Fdiv>\n          <div style=\"flex:1; text-align:center; padding:10px 5px; border-radius:11px; background:#ccfbf1; color:#115e59; font-weight:700; font-size:12px;\">Rate Limit<div style=\"font-weight:400; font-size:10.5px; margin-top:2px;\">Giới hạn<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:11px 14px; border-radius:12px; background:#f0fdfa; border-left:4px solid #14b8a6; font-size:13px; color:#334155; line-height:1.5;\"><b style=\"color:#0f766e;\">5 · Thông báo quản trị viên:<\u002Fb> gửi cảnh báo tới hệ thống giám sát hoặc email.<\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><div style=\"margin:18px 0 0; position:relative;\">\n  <div style=\"position:absolute; left:-35px; top:30px; width:15px; height:15px; border-radius:50%; background:#06b6d4; border:3px solid #0e1730; box-shadow:0 0 0 3px rgba(6,182,212,.35);\"><\u002Fdiv>\n  <div style=\"background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 12px 34px rgba(2,8,40,.45);\">\n    <div style=\"display:flex; align-items:center; gap:12px; padding:15px 20px; background:linear-gradient(135deg,#22d3ee,#06b6d4);\">\n      <span style=\"font-size:22px;\">🗂️<\u002Fspan><span style=\"font-size:19px; font-weight:800; color:#fff;\">Phân loại<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"padding:18px 20px; display:grid; grid-template-columns:1fr 1fr; gap:11px;\">\n      <div style=\"padding:14px; border-radius:13px; background:linear-gradient(160deg,#ecfeff,#cffafe);\">\n        <div style=\"font-size:24px; margin-bottom:6px;\">💻<\u002Fdiv>\n        <div style=\"font-weight:800; font-size:15px; color:#0e7490;\">HIPS<\u002Fdiv>\n        <div style=\"font-size:11.5px; font-weight:600; color:#155e75; margin-bottom:5px;\">Host-based<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#475569; line-height:1.45;\">Cài trên từng thiết bị/máy chủ để bảo vệ tài nguyên cụ thể.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px; border-radius:13px; background:linear-gradient(160deg,#ecfeff,#cffafe);\">\n        <div style=\"font-size:24px; margin-bottom:6px;\">🌐<\u002Fdiv>\n        <div style=\"font-weight:800; font-size:15px; color:#0e7490;\">NIPS<\u002Fdiv>\n        <div style=\"font-size:11.5px; font-weight:600; color:#155e75; margin-bottom:5px;\">Network-based<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#475569; line-height:1.45;\">Đặt tại điểm đầu/giữa mạng, giám sát toàn bộ lưu lượng.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px; border-radius:13px; background:linear-gradient(160deg,#ecfeff,#cffafe);\">\n        <div style=\"font-size:24px; margin-bottom:6px;\">📡<\u002Fdiv>\n        <div style=\"font-weight:800; font-size:15px; color:#0e7490;\">WIPS<\u002Fdiv>\n        <div style=\"font-size:11.5px; font-weight:600; color:#155e75; margin-bottom:5px;\">Wireless<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#475569; line-height:1.45;\">Bảo vệ mạng không dây khỏi AP giả mạo.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px; border-radius:13px; background:linear-gradient(160deg,#cffafe,#a5f3fc);\">\n        <div style=\"font-size:24px; margin-bottom:6px;\">🧩<\u002Fdiv>\n        <div style=\"font-weight:800; font-size:15px; color:#0e7490;\">Hybrid<\u002Fdiv>\n        <div style=\"font-size:11.5px; font-weight:600; color:#155e75; margin-bottom:5px;\">Kết hợp<\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#475569; line-height:1.45;\">Kết hợp HIPS + NIPS để bảo vệ toàn diện.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hide: false };\n  renderVals() {\n    return {\n      rootData: this.state.hide ? 'hide' : '',\n      exLabel: this.state.hide ? '💡 Hiện ví dụ' : '🙈 Ẩn ví dụ',\n      toggleEx: () => this.setState(s => ({ hide: !s.hide })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
