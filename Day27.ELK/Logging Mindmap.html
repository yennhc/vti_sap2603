document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ght:800;color:#0F766E;\">Thành phần<\u002Fh2><div style=\"font-size:13px;color:#64748B;font-weight:500;\">Cấu tạo của một hệ thống log<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-size:13px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;\">Log Events<\u002Fdiv>\n        <p style=\"margin:0 0 16px;font-size:15px;line-height:1.5;color:#334155;\">Thông tin cụ thể được ghi nhận: <b>lỗi, cảnh báo, thông báo, truy cập người dùng<\u002Fb>.<\u002Fp>\n\n        <div style=\"font-size:13px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;\">Log Levels — mức độ nghiêm trọng<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:18px;\">\n          <div style=\"display:flex;align-items:center;gap:12px;background:#F1F5F9;border-radius:9px;padding:9px 14px;\"><span style=\"flex:none;width:84px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#475569;\">DEBUG<\u002Fspan><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#94A3B8;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;\">Thông tin chi tiết phục vụ debugging<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#EFF6FF;border-radius:9px;padding:9px 14px;\"><span style=\"flex:none;width:84px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#2563EB;\">INFO<\u002Fspan><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#2563EB;\"><\u002Fspan><span style=\"font-size:14px;color:#1E40AF;\">Thông tin chung về hoạt động ứng dụng<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#FFFBEB;border-radius:9px;padding:9px 14px;\"><span style=\"flex:none;width:84px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#D97706;\">WARNING<\u002Fspan><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#F59E0B;\"><\u002Fspan><span style=\"font-size:14px;color:#92400E;\">Cảnh báo vấn đề có thể xảy ra<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#FEF2F2;border-radius:9px;padding:9px 14px;\"><span style=\"flex:none;width:84px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#DC2626;\">ERROR<\u002Fspan><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#EF4444;\"><\u002Fspan><span style=\"font-size:14px;color:#991B1B;\">Lỗi ảnh hưởng một phần chức năng<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px;background:#1F1417;border-radius:9px;padding:9px 14px;\"><span style=\"flex:none;width:84px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#FCA5A5;\">CRITICAL<\u002Fspan><span style=\"flex:none;width:8px;height:8px;border-radius:50%;background:#B91C1C;\"><\u002Fspan><span style=\"font-size:14px;color:#FECACA;\">Lỗi nghiêm trọng, có thể sập hệ thống<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n          <div style=\"flex:1 1 180px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;\">Log Format<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">timestamp<\u002Fspan>\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">source<\u002Fspan>\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">severity<\u002Fspan>\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">message<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 180px;\">\n            <div style=\"font-size:13px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;\">Log Storage<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">File hệ thống<\u002Fspan>\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">Database<\u002Fspan>\n              <span style=\"background:#E2F5F2;color:#0F766E;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:20px;\">Cloud<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:18px;background:#0F172A;border-radius:12px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.6;overflow-x:auto;\">\n          <div style=\"color:#64748B;font-size:11px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em;\">Ví dụ · format đầy đủ<\u002Fdiv>\n          <span style=\"color:#94A3B8;\">[2024-10-01T14:23:01Z]<\u002Fspan> <span style=\"color:#38BDF8;\">[auth-api]<\u002Fspan> <span style=\"color:#FBBF24;font-weight:700;\">[WARNING]<\u002Fspan> <span style=\"color:#E2E8F0;\">Đăng nhập thất bại 5 lần từ IP 203.0.113.9<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <!-- ===== MODULE 4: CÁC LOẠI LOG ===== -->\n      <section id=\"m4\" style=\"background:#fff;border:1px solid #E6ECF5;border-radius:22px;box-shadow:0 14px 38px rgba(15,40,90,.07);padding:26px 28px;border-top:5px solid #16A34A;\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;\">\n          <span style=\"width:46px;height:46px;border-radius:13px;background:#E6F6EC;color:#16A34A;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;\">4<\u002Fspan>\n          <div><h2 style=\"margin:0;font-size:23px;font-weight:800;color:#15803D;\">Các loại log<\u002Fh2><div style=\"font-size:13px;color:#64748B;font-weight:500;\">Phân loại theo nguồn &amp; mục đích<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;\">\n          <div style=\"border:1px solid #DCFCE7;border-radius:12px;padding:12px 15px;background:#F7FEF9;\"><div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:9px;height:9px;border-radius:3px;background:#16A34A;\"><\u002Fspan><b style=\"font-size:15px;color:#166534;\">Application Logging<\u002Fb><\u002Fdiv><div style=\"font-size:13.5px;color:#475569;margin-top:4px;line-height:1.45;\">Hoạt động, lỗi, sự kiện của ứng dụng. <i>VD: truy cập API, lỗi cơ sở dữ liệu.<\u002Fi><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #DCFCE7;border-radius:12px;padding:12px 15px;background:#F7FEF9;\"><div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:9px;height:9px;border-radius:3px;background:#16A34A;\"><\u002Fspan><b style=\"font-size:15px;color:#166534;\">System Logging<\u002Fb><\u002Fdiv><div style=\"font-size:13.5px;color:#475569;margin-top:4px;line-height:1.45;\">Khởi động/dừng dịch vụ, thay đổi cấu hình. <i>VD: /var/log/syslog trên Linux.<\u002Fi><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #DCFCE7;border-radius:12px;padding:12px 15px;background:#F7FEF9;\"><div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:9px;height:9px;border-radius:3px;background:#16A34A;\"><\u002Fspan><b style=\"font-size:15px;color:#166534;\">Security Logging<\u002Fb><\u002Fdiv><div style=\"font-size:13.5px;color:#475569;margin-top:4px;line-height:1.45;\">Đăng nhập thất bại, nỗ lực tấn công. <i>VD: Firewall logs, IDS/IPS logs.<\u002Fi><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #DCFCE7;border-radius:12px;padding:12px 15px;background:#F7FEF9;\"><div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:9px;height:9px;border-radius:3px;background:#16A34A;\"><\u002Fspan><b style=\"font-size:15px;color:#166534;\">Audit Logging<\u002Fb><\u002Fdiv><div style=\"font-size:13.5px;color:#475569;margin-top:4px;line-height:1.45;\">Hành động của người dùng / hệ thống để phục vụ kiểm toán.<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #DCFCE7;border-radius:12px;padding:12px 15px;background:#F7FEF9;\"><div style=\"display:flex;align-items:center;gap:9px;\"><span style=\"width:9px;height:9px;border-radius:3px;background:#16A34A;\"><\u002Fspan><b style=\"font-size:15px;color:#166534;\">Network Logging<\u002Fb><\u002Fdiv><div style=\"font-size:13.5px;color:#475569;margin-top:4px;line-height:1.45;\">Lưu lượng mạng, trạng thái kết nối, sự cố giao tiếp mạng.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ===== MODULE 5: TECHSTACK ===== -->\n      <section id=\"m5\" style=\"grid-column:1/-1;background:#fff;border:1px solid #E6ECF5;border-radius:22px;box-shadow:0 14px 38px rgba(15,40,90,.07);padding:26px 28px;border-top:5px solid #EA580C;\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px;\">\n          <span style=\"width:46px;height:46px;border-radius:13px;background:#FFEEE2;color:#EA580C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;\">5<\u002Fspan>\n          <div><h2 style=\"margin:0;font-size:23px;font-weight:800;color:#C2410C;\">Techstack<\u002Fh2><div style=\"font-size:13px;color:#64748B;font-weight:500;\">Công cụ &amp; nền tảng quản lý log<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;\">\n          <div style=\"border:1px solid #FFE4D1;border-radius:14px;padding:16px;background:#FFF8F4;\">\n            <b style=\"font-size:16px;color:#C2410C;\">Syslog<\u002Fb>\n            <p style=\"margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#475569;\">Tiêu chuẩn ghi log trên Linux/Unix, hỗ trợ tập trung hóa log từ nhiều thiết bị.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #FFE4D1;border-radius:14px;padding:16px;background:#FFF8F4;grid-row:span 2;\">\n            <b style=\"font-size:16px;color:#C2410C;\">ELK Stack<\u002Fb>\n            <img src=\"3a203ec0-4461-4b6e-bb32-561832d5fb25\" alt=\"ELK Stack\" style=\"width:100%;height:auto;margin:10px 0;border-radius:8px;background:#fff;padding:8px;\">\n            <div style=\"display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.4;color:#475569;\">\n              <div><b style=\"color:#0F766E;\">Elasticsearch<\u002Fb> — lưu trữ &amp; tìm kiếm log<\u002Fdiv>\n              <div><b style=\"color:#C2410C;\">Logstash<\u002Fb> — thu thập, xử lý log<\u002Fdiv>\n              <div><b style=\"color:#DB2777;\">Kibana<\u002Fb> — hiển thị &amp; phân tích qua giao diện<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #FFE4D1;border-radius:14px;padding:16px;background:#FFF8F4;\">\n            <b style=\"font-size:16px;color:#C2410C;\">Fluentd<\u002Fb>\n            <p style=\"margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#475569;\">Công cụ thu thập log đa nền tảng, dễ tích hợp với nhiều hệ thống.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #FFE4D1;border-radius:14px;padding:16px;background:#FFF8F4;\">\n            <b style=\"font-size:16px;color:#C2410C;\">Graylog<\u002Fb>\n            <p style=\"margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#475569;\">Hệ thống quản lý log tập trung, hỗ trợ tìm kiếm và phân tích log.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #FFE4D1;border-radius:14px;padding:16px;background:#FFF8F4;\">\n            <b style=\"font-size:16px;color:#C2410C;\">Splunk / QRadar<\u002Fb>\n            <p style=\"margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#475569;\">Công cụ thương mại mạnh mẽ, phổ biến trong doanh nghiệp lớn.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- ===== MODULE 6: THỰC HÀNH ===== -->\n      <section id=\"m6\" style=\"grid-column:1/-1;background:linear-gradient(135deg,#831843,#BE185D);border-radius:22px;box-shadow:0 18px 44px rgba(190,24,93,.28);padding:28px 30px;color:#fff;\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px;\">\n          <span style=\"width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;\">6<\u002Fspan>\n          <div><h2 style=\"margin:0;font-size:23px;font-weight:800;\">Thực hành<\u002Fh2><div style=\"font-size:13px;color:#FBCFE8;font-weight:500;\">Bài lab triển khai thực tế<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;\">\n          <div style=\"background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:18px;\">\n            <div style=\"font-size:30px;font-weight:800;color:#FBCFE8;line-height:1;\">01<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:700;margin-top:8px;\">Cài đặt Rsyslog Server<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#FBCFE8;margin-top:4px;line-height:1.45;\">Dựng máy chủ nhận log tập trung.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:18px;\">\n            <div style=\"font-size:30px;font-weight:800;color:#FBCFE8;line-height:1;\">02<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:700;margin-top:8px;\">Cài đặt Elasticsearch, Logstash, Kibana<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#FBCFE8;margin-top:4px;line-height:1.45;\">Triển khai bộ ELK để lưu trữ &amp; trực quan hóa.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:18px;\">\n            <div style=\"font-size:30px;font-weight:800;color:#FBCFE8;line-height:1;\">03<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:700;margin-top:8px;\">Thu thập Log: OS, Nginx<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#FBCFE8;margin-top:4px;line-height:1.45;\">Đẩy log hệ điều hành &amp; web server về hệ thống.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <footer style=\"margin-top:34px;text-align:center;font-size:13px;color:#94A3B8;\">\n      Logging · Lesson 27–28 · VTI Academy — Way to Enterprise &nbsp;·&nbsp; Sơ đồ tư duy biên soạn lại theo dạng module\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180},&quot;showOverview&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showExamples&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showOverview: this.props.showOverview ?? true,\n      showExamples: this.props.showExamples ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
