  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 vào slave báo READONLY<\u002Fcode><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12.5px;color:#7c88ad;font-style:italic\">Slave mặc định chỉ đọc (read-only) — đúng như thiết kế Master ghi, Slave đọc.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 2.5 -->\n    <div class=\"task\" data-task=\"s25\" style=\"border:1px solid rgba(160,107,255,.15);border-radius:16px;background:rgba(20,26,46,.55);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span class=\"chk\" data-task=\"s25\" sc-camel-on-click=\"{{ toggle }}\" style=\"flex:none;width:26px;height:26px;border-radius:8px;border:2px solid rgba(183,139,255,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:transparent;transition:all .15s\">✓<\u002Fspan>\n        <span style=\"font:700 12px 'JetBrains Mono',monospace;color:#b78bff\">BƯỚC 2.5<\u002Fspan>\n        <h3 style=\"margin:0;flex:1;font:700 18px 'Sora',sans-serif;color:#fff\">Thử ngắt &amp; gắn lại replication<\u002Fh3>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px\">\n        <p style=\"margin:0 0 12px;font-size:14px;color:#aab4d2\"><b style=\"color:#e6ebf5\">Mục tiêu:<\u002Fb> hiểu cách tách slave thành độc lập rồi gắn lại bằng lệnh.<\u002Fp>\n        <div style=\"position:relative;margin-bottom:12px\"><button sc-camel-on-click=\"{{ copy }}\" style=\"position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9fb4e6;font:600 11px 'Be Vietnam Pro';cursor:pointer\">Copy<\u002Fbutton><pre style=\"margin:0;padding:16px 18px;border-radius:12px;background:#05070f;border:1px solid rgba(255,255,255,.07);font:500 13px/1.8 'JetBrains Mono',monospace;color:#c9b0ff;overflow-x:auto\"><span style=\"color:#5f6b90\"># tách slave ra làm master độc lập<\u002Fspan>\nredis-cli -p 6380 REPLICAOF NO ONE\n<span style=\"color:#5f6b90\"># gắn lại làm slave của 6379<\u002Fspan>\nredis-cli -p 6380 REPLICAOF 127.0.0.1 6379<\u002Fpre><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#9fb0a8\"><span style=\"color:#5fd6a0;font-weight:700\">→ Kết quả:<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;color:#5fd6a0\">role đổi qua lại giữa master ↔ slave<\u002Fcode><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12.5px;color:#7c88ad;font-style:italic\">Đây chính là thao tác thủ công khi master gặp sự cố (nâng slave lên làm master).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ================= MODULE 3 ================= -->\n    <div id=\"m3\" style=\"scroll-margin-top:20px;margin-top:24px;display:flex;align-items:center;gap:16px\">\n      <div style=\"width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#38d6c8,#5fd6a0);display:flex;align-items:center;justify-content:center;font:800 22px 'Sora',sans-serif;color:#03211c\">3<\u002Fdiv>\n      <div><h2 style=\"margin:0;font:700 30px/1 'Sora',sans-serif;color:#fff\">Backup / Restore Redis<\u002Fh2><p style=\"margin:4px 0 0;font-size:13.5px;color:#8493b8\">Sao lưu bằng RDB &amp; AOF, và phục hồi dữ liệu<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3.1 -->\n    <div class=\"task\" data-task=\"s31\" style=\"border:1px solid rgba(56,214,200,.18);border-radius:16px;background:rgba(20,26,46,.55);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span class=\"chk\" data-task=\"s31\" sc-camel-on-click=\"{{ toggle }}\" style=\"flex:none;width:26px;height:26px;border-radius:8px;border:2px solid rgba(95,224,208,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:transparent;transition:all .15s\">✓<\u002Fspan>\n        <span style=\"font:700 12px 'JetBrains Mono',monospace;color:#5fe0d0\">BƯỚC 3.1<\u002Fspan>\n        <h3 style=\"margin:0;flex:1;font:700 18px 'Sora',sans-serif;color:#fff\">Tạo snapshot RDB thủ công<\u002Fh3>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px\">\n        <p style=\"margin:0 0 12px;font-size:14px;color:#aab4d2\"><b style=\"color:#e6ebf5\">Mục tiêu:<\u002Fb> chụp toàn bộ dữ liệu ra file <code style=\"font-family:'JetBrains Mono',monospace;color:#8fe8c8\">dump.rdb<\u002Fcode>.<\u002Fp>\n        <div style=\"position:relative;margin-bottom:12px\"><button sc-camel-on-click=\"{{ copy }}\" style=\"position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9fb4e6;font:600 11px 'Be Vietnam Pro';cursor:pointer\">Copy<\u002Fbutton><pre style=\"margin:0;padding:16px 18px;border-radius:12px;background:#05070f;border:1px solid rgba(255,255,255,.07);font:500 13px/1.8 'JetBrains Mono',monospace;color:#8fe8c8;overflow-x:auto\">redis-cli -p 6379 CONFIG GET dir\nredis-cli -p 6379 CONFIG GET dbfilename\nredis-cli -p 6379 BGSAVE\nredis-cli -p 6379 LASTSAVE\nls -lh ~/redis-lab/master/dump.rdb<\u002Fpre><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#9fb0a8\"><span style=\"color:#5fd6a0;font-weight:700\">→ Kết quả:<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;color:#5fd6a0\">Background saving started; file dump.rdb xuất hiện trong thư mục dir<\u002Fcode><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12.5px;color:#7c88ad;font-style:italic\"><b style=\"color:#a9b3d0\">BGSAVE<\u002Fb> lưu ở nền (không chặn); <b style=\"color:#a9b3d0\">SAVE<\u002Fb> lưu ngay nhưng chặn server — chỉ dùng khi cần.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3.2 -->\n    <div class=\"task\" data-task=\"s32\" style=\"border:1px solid rgba(56,214,200,.18);border-radius:16px;background:rgba(20,26,46,.55);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span class=\"chk\" data-task=\"s32\" sc-camel-on-click=\"{{ toggle }}\" style=\"flex:none;width:26px;height:26px;border-radius:8px;border:2px solid rgba(95,224,208,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:transparent;transition:all .15s\">✓<\u002Fspan>\n        <span style=\"font:700 12px 'JetBrains Mono',monospace;color:#5fe0d0\">BƯỚC 3.2<\u002Fspan>\n        <h3 style=\"margin:0;flex:1;font:700 18px 'Sora',sans-serif;color:#fff\">Bật tự động lưu &amp; sao lưu file<\u002Fh3>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px\">\n        <p style=\"margin:0 0 12px;font-size:14px;color:#aab4d2\"><b style=\"color:#e6ebf5\">Mục tiêu:<\u002Fb> cấu hình auto-save và copy file backup ra nơi an toàn.<\u002Fp>\n        <div style=\"position:relative;margin-bottom:12px\"><button sc-camel-on-click=\"{{ copy }}\" style=\"position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9fb4e6;font:600 11px 'Be Vietnam Pro';cursor:pointer\">Copy<\u002Fbutton><pre style=\"margin:0;padding:16px 18px;border-radius:12px;background:#05070f;border:1px solid rgba(255,255,255,.07);font:500 12.5px/1.8 'JetBrains Mono',monospace;color:#8fe8c8;overflow-x:auto\"><span style=\"color:#5f6b90\"># auto-save: lưu nếu ≥1 key đổi trong 900s, ≥10 trong 300s...<\u002Fspan>\nredis-cli -p 6379 CONFIG SET save \"900 1 300 10 60 10000\"\n<span style=\"color:#5f6b90\"># sao chép file backup kèm ngày<\u002Fspan>\ncp ~/redis-lab/master/dump.rdb ~/backup-$(date +%F).rdb<\u002Fpre><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#9fb0a8\"><span style=\"color:#5fd6a0;font-weight:700\">→ Kết quả:<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;color:#5fd6a0\">file backup-YYYY-MM-DD.rdb được tạo trong ~<\u002Fcode><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3.3 -->\n    <div class=\"task\" data-task=\"s33\" style=\"border:1px solid rgba(56,214,200,.18);border-radius:16px;background:rgba(20,26,46,.55);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span class=\"chk\" data-task=\"s33\" sc-camel-on-click=\"{{ toggle }}\" style=\"flex:none;width:26px;height:26px;border-radius:8px;border:2px solid rgba(95,224,208,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:transparent;transition:all .15s\">✓<\u002Fspan>\n        <span style=\"font:700 12px 'JetBrains Mono',monospace;color:#5fe0d0\">BƯỚC 3.3<\u002Fspan>\n        <h3 style=\"margin:0;flex:1;font:700 18px 'Sora',sans-serif;color:#fff\">Restore từ RDB<\u002Fh3>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px\">\n        <p style=\"margin:0 0 12px;font-size:14px;color:#aab4d2\"><b style=\"color:#e6ebf5\">Mục tiêu:<\u002Fb> phục hồi dữ liệu bằng cách đưa file dump.rdb vào rồi khởi động lại.<\u002Fp>\n        <div style=\"position:relative;margin-bottom:12px\"><button sc-camel-on-click=\"{{ copy }}\" style=\"position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9fb4e6;font:600 11px 'Be Vietnam Pro';cursor:pointer\">Copy<\u002Fbutton><pre style=\"margin:0;padding:16px 18px;border-radius:12px;background:#05070f;border:1px solid rgba(255,255,255,.07);font:500 12.5px/1.8 'JetBrains Mono',monospace;color:#8fe8c8;overflow-x:auto\"><span style=\"color:#5f6b90\"># 1) tắt server (Ctrl+C ở terminal master, hoặc):<\u002Fspan>\nredis-cli -p 6379 SHUTDOWN NOSAVE\n<span style=\"color:#5f6b90\"># 2) đặt file backup vào đúng thư mục dir<\u002Fspan>\ncp ~/backup-$(date +%F).rdb ~/redis-lab/master/dump.rdb\n<span style=\"color:#5f6b90\"># 3) khởi động lại — Redis tự nạp dump.rdb<\u002Fspan>\nredis-server ~/redis-lab/master.conf\nredis-cli -p 6379 GET hello<\u002Fpre><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#9fb0a8\"><span style=\"color:#5fd6a0;font-weight:700\">→ Kết quả:<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;color:#5fd6a0\">dữ liệu cũ quay lại: GET hello → \"VTI Redis Lab\"<\u002Fcode><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12.5px;color:#7c88ad;font-style:italic\">Quan trọng: tên file phải khớp <b style=\"color:#a9b3d0\">dbfilename<\u002Fb> và nằm trong thư mục <b style=\"color:#a9b3d0\">dir<\u002Fb> của cấu hình.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 3.4 -->\n    <div class=\"task\" data-task=\"s34\" style=\"border:1px solid rgba(56,214,200,.18);border-radius:16px;background:rgba(20,26,46,.55);overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06)\">\n        <span class=\"chk\" data-task=\"s34\" sc-camel-on-click=\"{{ toggle }}\" style=\"flex:none;width:26px;height:26px;border-radius:8px;border:2px solid rgba(95,224,208,.5);display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;color:transparent;transition:all .15s\">✓<\u002Fspan>\n        <span style=\"font:700 12px 'JetBrains Mono',monospace;color:#5fe0d0\">BƯỚC 3.4<\u002Fspan>\n        <h3 style=\"margin:0;flex:1;font:700 18px 'Sora',sans-serif;color:#fff\">Sao lưu bằng AOF (tuỳ chọn)<\u002Fh3>\n      <\u002Fdiv>\n      <div style=\"padding:18px 20px\">\n        <p style=\"margin:0 0 12px;font-size:14px;color:#aab4d2\"><b style=\"color:#e6ebf5\">Mục tiêu:<\u002Fb> bật AOF ghi lại mọi lệnh — an toàn hơn, ít mất dữ liệu hơn RDB.<\u002Fp>\n        <div style=\"position:relative;margin-bottom:12px\"><button sc-camel-on-click=\"{{ copy }}\" style=\"position:absolute;top:10px;right:10px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#9fb4e6;font:600 11px 'Be Vietnam Pro';cursor:pointer\">Copy<\u002Fbutton><pre style=\"margin:0;padding:16px 18px;border-radius:12px;background:#05070f;border:1px solid rgba(255,255,255,.07);font:500 13px/1.8 'JetBrains Mono',monospace;color:#8fe8c8;overflow-x:auto\">redis-cli -p 6379 CONFIG SET appendonly yes\nredis-cli -p 6379 CONFIG GET appendonly\nredis-cli -p 6379 BGREWRITEAOF\nls ~/redis-lab/master/ | grep aof<\u002Fpre><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#9fb0a8\"><span style=\"color:#5fd6a0;font-weight:700\">→ Kết quả:<\u002Fspan><code style=\"font-family:'JetBrains Mono',monospace;color:#5fd6a0\">appendonly = yes; sinh ra file appendonly.aof (restore bằng cách nạp file này)<\u002Fcode><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12.5px;color:#7c88ad;font-style:italic\">So sánh: RDB gọn &amp; khôi phục nhanh; AOF an toàn hơn nhưng file lớn hơn. Có thể bật cả hai.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- FINISH -->\n    <div style=\"margin-top:16px;padding:30px 32px;border-radius:18px;text-align:center;background:radial-gradient(600px 220px at 50% 0,rgba(56,214,200,.18),transparent),linear-gradient(180deg,rgba(20,26,46,.9),rgba(13,17,32,.9));border:1px solid rgba(255,255,255,.08)\">\n      <div style=\"font:800 26px 'Sora',sans-serif;color:#fff;margin-bottom:8px\">Hoàn thành bài lab 🎉<\u002Fdiv>\n      <p style=\"margin:0 0 4px;font-size:15px;color:#c3cbe2\">Bạn đã cài Standalone, dựng Master–Slave và backup/restore mà không cần Docker.<\u002Fp>\n      <p style=\"margin:0;font-size:13px;color:#93a0c2\"><b style=\"color:#c3cbe2\">© Yên Nguyễn.<\u002Fb> All Rights Reserved.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  KEY = 'redis-lab-native-progress';\n  load(){ try { return new Set(JSON.parse(localStorage.getItem(this.KEY) || '[]')); } catch(e){ return new Set(); } }\n  save(set){ localStorage.setItem(this.KEY, JSON.stringify([...set])); }\n  paint(){\n    const done = this.load();\n    const cards = document.querySelectorAll('.task');\n    cards.forEach(card => {\n      const id = card.getAttribute('data-task');\n      const on = done.has(id);\n      const chk = card.querySelector('.chk');\n      if(chk){\n        chk.style.color = on ? '#04160d' : 'transparent';\n        chk.style.background = on ? 'linear-gradient(135deg,#43c088,#5fd6a0)' : 'transparent';\n        if(on) chk.style.borderColor = '#5fd6a0';\n      }\n      card.style.opacity = on ? '.72' : '1';\n    });\n    const total = cards.length || 1, n = done.size, pct = Math.round(n/total*100);\n    const bar = document.getElementById('om-progress'); if(bar) bar.style.width = pct + '%';\n    const bar2 = document.getElementById('om-bar2'); if(bar2) bar2.style.width = pct + '%';\n    const pctEl = document.getElementById('om-pct'); if(pctEl) pctEl.textContent = pct + '%';\n    const cnt = document.getElementById('om-count'); if(cnt) cnt.innerHTML = '<b style=\"color:#e6ebf5\">'+n+'/'+total+'<\u002Fb> bước đã xong';\n  }\n  componentDidMount(){ this.paint(); }\n  renderVals(){\n    return {\n      toggle: (e) => {\n        const id = e.currentTarget.getAttribute('data-task');\n        const done = this.load();\n        if(done.has(id)) done.delete(id); else done.add(id);\n        this.save(done); this.paint();\n      },\n      copy: (e) => {\n        const pre = e.currentTarget.parentElement.querySelector('pre');\n        if(!pre) return;\n        navigator.clipboard && navigator.clipboard.writeText(pre.innerText);\n        const b = e.currentTarget, old = b.textContent;\n        b.textContent = 'Đã copy ✓'; b.style.color = '#5fd6a0';\n        setTimeout(()=>{ b.textContent = old; b.style.color = '#9fb4e6'; }, 1200);\n      },\n      reset: () => { if(confirm('Đặt lại toàn bộ tiến độ?')){ localStorage.removeItem(this.KEY); this.paint(); } }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
