document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;\">1<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:800;\">Switch &amp; Quản trị cơ bản<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E6E4DD;background:#F8FAFC;\">\n          <img src=\"e2035ba5-0df7-46d7-a778-948e05c2c448\" alt=\"Mô hình sao kết nối Switch\" style=\"display:block;width:100%;height:auto;\">\n          <div style=\"font-size:11.5px;color:#94A3B8;padding:7px 12px;background:#fff;border-top:1px solid #EEF0F2;\">Mô hình sao — Switch là thiết bị trung tâm kết nối mọi máy<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#2F6DB5;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Định nghĩa<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #2F6DB533;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Bộ chuyển mạch / thiết bị chuyển mạch<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Kết nối các đoạn mạng theo mô hình sao (star)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Là thiết bị trung tâm — mọi máy đều nối về đây<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#2F6DB5;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Cấu tạo<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #2F6DB533;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:12px;\">\n            <div style=\"border-radius:10px;overflow:hidden;border:1px solid #E6E4DD;background:#F8FAFC;\">\n              <img src=\"76e9788f-c33f-4369-aa76-c317f8516072\" alt=\"Switch Cisco Catalyst 24 cổng\" style=\"display:block;width:100%;height:auto;\">\n              <div style=\"font-size:11px;color:#94A3B8;padding:6px 11px;background:#fff;border-top:1px solid #EEF0F2;\">Switch Cisco Catalyst 24 cổng — phần cứng thực tế<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px;font-weight:600;color:#2F6DB5;margin-bottom:6px;\">Phần cứng (hardware)<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">Khung vỏ (nhựa/sắt), nguồn điện<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">CPU, bộ nhớ, bo mạch chủ, bus hệ thống<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">Cổng kết nối: 4 / 8 / 16 / 24 / 48 cổng<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:14px;font-weight:600;color:#2F6DB5;margin-bottom:6px;\">Phần mềm (software)<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">Hệ điều hành (OS) điều khiển thiết bị — ví dụ Cisco IOS<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#2F6DB5;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Nhiệm vụ: chuyển mạch frame<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #2F6DB533;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Frame vào 1 cổng → chuyển tiếp đến thiết bị nhận<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Dựa vào bảng MAC (MAC Address Table)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Học &amp; ghi địa chỉ MAC của host theo từng cổng<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:rgba(47,109,181,.07);border-left:3px solid #2F6DB5;border-radius:11px;padding:13px 15px;\">\n            <div style=\"font-size:11px;letter-spacing:1.2px;font-weight:800;color:#2F6DB5;text-transform:uppercase;margin-bottom:8px;\">Ví dụ minh hoạ<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• PC-A (MAC <b>aa:aa:aa<\u002Fb>) cắm vào cổng <b>Fa0/1<\u002Fb>, gửi frame<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• Switch ghi <b>Fa0/1 ↔ aa:aa:aa<\u002Fb> vào bảng MAC<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• Frame sau gửi tới aa:aa:aa → forward đúng cổng Fa0/1<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-radius:9px;overflow:hidden;border:1px solid #D9E3F0;margin-top:10px;\">\n              <img src=\"302aecee-a9bb-4444-92be-f5273142d610\" alt=\"Lệnh show mac address-table\" style=\"display:block;width:100%;height:auto;\">\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#64748B;font-style:italic;margin-top:8px;line-height:1.5;\">→ Switch tự học địa chỉ MAC để chuyển mạch chính xác (lệnh <span style=\"font-family:monospace;\">show mac address-table<\u002Fspan>).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BRANCH 2 -->\n    <div style=\"background:#fff;border-radius:18px;border:1px solid #E9E7E0;box-shadow:0 6px 28px rgba(15,23,42,.06);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:18px 24px;background:#1F9D74;color:#fff;\">\n        <div style=\"width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;\">2<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:800;\">VLAN — Virtual LAN (mạng LAN ảo)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E6E4DD;background:#F8FAFC;\">\n          <img src=\"960fd4d4-9614-4e5c-931a-c03ee101b80f\" alt=\"Phân chia VLAN theo phòng ban\" style=\"display:block;width:100%;height:auto;\">\n          <div style=\"font-size:11.5px;color:#94A3B8;padding:7px 12px;background:#fff;border-top:1px solid #EEF0F2;\">VLAN 2/3/4 cho IT, HR, Sales — tách logic dù dùng chung hạ tầng<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#1F9D74;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Khái niệm<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #1F9D7433;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Chia mạng LAN vật lý thành nhiều mạng logic riêng biệt<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Mỗi mạng logic = 1 VLAN<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#1F9D74;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Lợi ích<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #1F9D7433;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Tăng bảo mật — cô lập lưu lượng<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Giảm miền quảng bá (broadcast domain)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Linh hoạt — không phụ thuộc vị trí vật lý<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:rgba(31,157,116,.08);border-left:3px solid #1F9D74;border-radius:11px;padding:13px 15px;\">\n            <div style=\"font-size:11px;letter-spacing:1.2px;font-weight:800;color:#1F9D74;text-transform:uppercase;margin-bottom:8px;\">Ví dụ minh hoạ<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• <b>VLAN 10<\u002Fb> = Phòng Kế toán<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• <b>VLAN 20<\u002Fb> = Phòng Kỹ thuật<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• Cùng cắm 1 switch nhưng 2 VLAN không thấy nhau<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#64748B;font-style:italic;margin-top:8px;line-height:1.5;\">→ Dùng chung phần cứng nhưng bị cô lập như 2 mạng riêng.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BRANCH 3 -->\n    <div style=\"background:#fff;border-radius:18px;border:1px solid #E9E7E0;box-shadow:0 6px 28px rgba(15,23,42,.06);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:18px 24px;background:#E0892B;color:#fff;\">\n        <div style=\"width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;\">3<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:800;\">VTP — VLAN Trunking Protocol<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E6E4DD;background:#F8FAFC;\">\n          <img src=\"ec4f3290-9ff0-4db2-9940-a776c7bdb883\" alt=\"VTP Server đồng bộ tới các VTP Client\" style=\"display:block;width:100%;height:auto;\">\n          <div style=\"font-size:11.5px;color:#94A3B8;padding:7px 12px;background:#fff;border-top:1px solid #EEF0F2;\">VTP Server đồng bộ thông tin VLAN xuống các VTP Client<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#E0892B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Khái niệm<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #E0892B33;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Giao thức tầng liên kết dữ liệu (Layer 2 — OSI)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Tự động cấu hình &amp; đồng bộ thông tin VLAN giữa các switch<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Truyền thông tin VLAN qua đường Trunk<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#E0892B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Cơ chế hoạt động<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #E0892B33;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:12px;\">\n            <div>\n              <div style=\"font-size:14px;font-weight:600;color:#E0892B;margin-bottom:6px;\">3 chế độ VTP<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\"><b>Server<\u002Fb> — chứa &amp; thay đổi cấu hình VLAN<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\"><b>Client<\u002Fb> — lắng nghe &amp; áp dụng từ Server<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\"><b>Transparent<\u002Fb> — không truyền, chỉ chuyển tiếp<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">Thông tin VLAN: tên, số hiệu, tham số<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\"><b>Revision Number<\u002Fb> — số phiên bản theo dõi thay đổi; bản mới hơn → Client cập nhật<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:13.5px;color:#475569;line-height:1.5;\">Gửi/nhận qua Ethernet frames trên trunk<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showCli }}\" hint-placeholder-val=\"{{ true }}\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#E0892B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Cấu hình (lệnh CLI)<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#16233B;border-radius:11px;padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.7;color:#E2E8F0;overflow-x:auto;\">\n            <div><span style=\"color:#7C8BA5;\">switch(config)#<\u002Fspan> vtp mode &lt;server/client/transparent&gt;<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch(config)#<\u002Fspan> vtp domain &lt;tên-domain&gt;<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch(config)#<\u002Fspan> vtp password &lt;mật-khẩu&gt;<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch(config-if)#<\u002Fspan> switchport mode trunk<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch(config-if)#<\u002Fspan> switchport trunk encapsulation dot1q<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch(config-if)#<\u002Fspan> switchport trunk allowed vlan all<\u002Fdiv>\n            <div><span style=\"color:#7C8BA5;\">switch#<\u002Fspan> show vtp status<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:rgba(224,137,43,.09);border-left:3px solid #E0892B;border-radius:11px;padding:13px 15px;\">\n            <div style=\"font-size:11px;letter-spacing:1.2px;font-weight:800;color:#C77518;text-transform:uppercase;margin-bottom:8px;\">Ví dụ minh hoạ<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• <b>SW1 (Server)<\u002Fb> tạo mới VLAN 30 → revision number tăng<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• <b>SW2, SW3 (Client)<\u002Fb> nhận qua trunk → tự thêm VLAN 30<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#64748B;font-style:italic;margin-top:8px;line-height:1.5;\">→ Cấu hình 1 lần trên Server, các Client tự đồng bộ.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- BRANCH 4 -->\n    <div style=\"background:#fff;border-radius:18px;border:1px solid #E9E7E0;box-shadow:0 6px 28px rgba(15,23,42,.06);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:18px 24px;background:#B5453B;color:#fff;\">\n        <div style=\"width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;\">4<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:800;\">STP — Spanning Tree Protocol<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"border-radius:12px;overflow:hidden;border:1px solid #E6E4DD;background:#F8FAFC;\">\n          <img src=\"95290490-bad1-4c17-9623-75628ce67044\" alt=\"STP chặn 1 cổng để cắt vòng lặp\" style=\"display:block;width:100%;height:auto;\">\n          <div style=\"font-size:11.5px;color:#94A3B8;padding:7px 12px;background:#fff;border-top:1px solid #EEF0F2;\">STP block cổng Gi0/2 trên SW3 để phá vòng lặp giữa 3 switch<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#B5453B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Mục đích &amp; nguyên nhân<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #B5453B33;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Ngăn chặn <b>vòng lặp (loop)<\u002Fb> trong mạng LAN<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Vòng lặp sinh ra khi có nhiều đường cáp dự phòng giữa Switch/Bridge<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#B5453B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Hậu quả nếu không kiểm soát<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #B5453B33;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Broadcast Storms (bão quảng bá)<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Nhân bản gói tin · giảm hiệu suất mạng<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:center;gap:10px;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#B5453B;\"><\u002Fspan><span style=\"font-weight:700;font-size:15.5px;color:#0F172A;\">Cơ chế<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-left:18px;border-left:2px solid #B5453B33;padding-left:16px;margin-top:9px;display:flex;flex-direction:column;gap:7px;\">\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Chặn (block) cổng dư thừa → tạo cây không vòng lặp<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\"><span style=\"width:5px;height:5px;border-radius:50%;background:#CBD5E1;margin-top:8px;flex:none;\"><\u002Fspan><span style=\"font-size:14px;color:#475569;line-height:1.5;\">Tự kích hoạt lại đường dự phòng khi đường chính lỗi<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:rgba(181,69,59,.08);border-left:3px solid #B5453B;border-radius:11px;padding:13px 15px;\">\n            <div style=\"font-size:11px;letter-spacing:1.2px;font-weight:800;color:#B5453B;text-transform:uppercase;margin-bottom:8px;\">Ví dụ minh hoạ<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;\">\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• 3 switch nối vòng tam giác <b>A–B–C–A<\u002Fb><\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• STP block 1 cổng để cắt vòng lặp<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#334155;line-height:1.5;\">• Đường A–B hỏng → STP mở lại cổng đã block<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#64748B;font-style:italic;margin-top:8px;line-height:1.5;\">→ Giữ 1 đường hoạt động, đường còn lại làm dự phòng.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"max-width:1340px;margin:34px auto 0;text-align:center;font-size:12.5px;color:#94A3B8;\">\n    Nguồn: Lesson 8 — Network: Switch · VTI Academy · File <b>.xmind<\u002Fb> đính kèm để mở bằng ứng dụng XMind.\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:900},&quot;showExamples&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showCli&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      showExamples: this.props.showExamples ?? true,\n      showCli: this.props.showCli ?? true,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
