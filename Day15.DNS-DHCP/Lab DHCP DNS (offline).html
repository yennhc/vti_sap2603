document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <h1 style=\"margin:0; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:66px; line-height:1.02; letter-spacing:-0.02em; background:linear-gradient(120deg,#FF6B35,#EF476F,#4361EE,#06D6A0); -webkit-background-clip:text; background-clip:text; color:transparent;\">Lab: DHCP &amp; DNS<\u002Fh1>\n        <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:22px; color:#17183B; margin-top:8px;\">Windows Server 2019 — Thực hành từ A đến Z<\u002Fdiv>\n        <p style=\"max-width:640px; margin:18px auto 0; font-size:16.5px; line-height:1.65; color:#4A4B6A;\">Tự tay dựng một máy chủ cấp phát IP tự động (DHCP) và phân giải tên miền (DNS) cho mạng nội bộ — rồi kiểm tra từ máy client như một quản trị viên thực thụ.<\u002Fp>\n        <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"max-width:620px; margin:8px auto 0; font-size:14px; line-height:1.55; color:#9C98AE; font-style:italic;\">Build a Windows Server 2019 machine that auto-assigns IPs (DHCP) and resolves internal names (DNS), then verify it from a client.<\u002Fp><\u002Fsc-if>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:26px;\">\n          <span style=\"background:#fff; border:2px solid #ECE4D6; border-radius:99px; padding:8px 15px; font-size:13.5px; font-weight:600; box-shadow:2px 2px 0 rgba(23,24,59,0.05);\">🪟 Windows Server 2019<\u002Fspan>\n          <span style=\"background:#fff; border:2px solid #ECE4D6; border-radius:99px; padding:8px 15px; font-size:13.5px; font-weight:600; box-shadow:2px 2px 0 rgba(23,24,59,0.05);\">🎯 Người mới bắt đầu<\u002Fspan>\n          <span style=\"background:#fff; border:2px solid #ECE4D6; border-radius:99px; padding:8px 15px; font-size:13.5px; font-weight:600; box-shadow:2px 2px 0 rgba(23,24,59,0.05);\">⏱ ~60 phút<\u002Fspan>\n          <span style=\"background:#fff; border:2px solid #ECE4D6; border-radius:99px; padding:8px 15px; font-size:13.5px; font-weight:600; box-shadow:2px 2px 0 rgba(23,24,59,0.05);\">🌐 192.168.100.0/24<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:14px;\">\n          <span style=\"background:linear-gradient(135deg,#4361EE,#6C8BFF); color:#fff; border-radius:14px; padding:10px 18px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; box-shadow:3px 3px 0 rgba(23,24,59,0.15);\">🌐 DNS · Phân giải tên miền → IP<\u002Fspan>\n          <span style=\"background:linear-gradient(135deg,#FF6B35,#FF9558); color:#fff; border-radius:14px; padding:10px 18px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; box-shadow:3px 3px 0 rgba(23,24,59,0.15);\">⚙️ DHCP · Cấp phát IP tự động<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- OBJECTIVES -->\n    <div style=\"margin-top:40px;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:18px;\">\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;\">🎯 Mục tiêu bài lab<\u002Fspan>\n        <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#9C98AE; font-style:italic; font-size:15px;\">Lab objectives<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px;\">\n        <div style=\"background:#fff; border:2px solid #ECE4D6; border-top:6px solid #FF6B35; border-radius:18px; padding:20px; box-shadow:5px 5px 0 rgba(23,24,59,0.05);\"><div style=\"font-size:28px;\">⚙️<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; margin:8px 0 4px;\">Triển khai DHCP<\u002Fdiv><div style=\"font-size:13.5px; color:#4A4B6A; line-height:1.5;\">Cài role, tạo scope, cấu hình options và reservation.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#fff; border:2px solid #ECE4D6; border-top: ing:34px 28px; box-shadow:7px 8px 0 rgba(23,24,59,0.05);\">\n        <div style=\"display:flex; flex-direction:column; align-items:center;\">\n          <!-- internet -->\n          <div style=\"display:flex; align-items:center; gap:9px; background:#EEF1FF; border:2px dashed #B9C6FF; border-radius:16px; padding:10px 20px; font-family:'Space Grotesk',sans-serif; font-weight:700; color:#3147C4;\">☁️ Internet<\u002Fdiv>\n          <div style=\"width:3px; height:26px; background:#D9CFBE;\"><\u002Fdiv>\n          <!-- gateway -->\n          <div style=\"display:flex; align-items:center; gap:10px; background:#FFF3EC; border:2px solid #FFCBB0; border-radius:16px; padding:12px 22px;\"><span style=\"font-size:22px;\">🔀<\u002Fspan><div style=\"text-align:left;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14.5px;\">Gateway / Router<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#E24E1B;\">192.168.100.1<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:3px; height:26px; background:#D9CFBE;\"><\u002Fdiv>\n          <!-- server -->\n          <div style=\"background:linear-gradient(135deg,#17183B,#2A2C5E); border-radius:22px; padding:22px 26px; box-shadow:6px 7px 0 rgba(23,24,59,0.18); text-align:center; max-width:440px;\">\n            <div style=\"display:flex; align-items:center; justify-content:center; gap:12px;\"><span style=\"font-size:34px;\">🖥️<\u002Fspan><div style=\"text-align:left;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; color:#fff;\">SRV-01<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#8FB4FF;\">192.168.100.10 · IP tĩnh<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;\">\n              <span style=\"background:#FF6B35; color:#fff; border-radius:11px; padding:7px 13px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;\">⚙️ DHCP Server<\u002Fspan>\n              <span style=\"background:#4361EE; color:#fff; border-radius:11px; padding:7px 13px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px;\">🌐 DNS Server<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:3px; height:22px; background:#D9CFBE;\"><\u002Fdiv>\n          <!-- switch -->\n          <div style=\"width:100%; max-width:560px; display:flex; align-items:center; justify-content:center; gap:9px; background:#F4F0E7; border:2px solid #E4DCCC; border-radius:14px; padding:9px 18px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; color:#6A6580;\">🔗 Switch — mạng nội bộ 192.168.100.0/24<\u002Fdiv>\n          <!-- fan-out rail -->\n          <div style=\"width:100%; max-width:560px; display:flex; justify-content:space-around; margin-top:0;\">\n            <div style=\"width:3px; height:22px; background:#D9CFBE;\"><\u002Fdiv>\n            <div style=\"width:3px; height:22px; background:#D9CFBE;\"><\u002Fdiv>\n            <div style=\"width:3px; height:22px; background:#D9CFBE;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <!-- clients -->\n          <div style=\"display:flex; flex-wrap:wrap; gap:16px; justify-content:center;\">\n            <div style=\"background:#F0FBF6; border:2px solid #A9E7CE; border-radius:16px; padding:14px 18px; text-align:center; min-width:150px;\"><div style=\"font-size:26px;\">💻<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-top:4px;\">PC-01<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#05A67B;\">.101 · DHCP<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#F0FBF6; border:2px solid #A9E7CE; border-radius:16px; padding:14px 18px; text-align:center; min-width:150px;\"><div style=\"font-size:26px;\">💻<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-top:4px;\">PC-02<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#05A67B;\">.102 · DHCP<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:#FBF3FF; border:2px solid #E0BEF7; border-radius:16px; padding:14px 18px; text-align:center; min-width:150px;\"><div style=\"font-size:26px;\">🖨️<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-top:4px;\">Printer-01<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:12px; color:#7A3DC4;\">.50 · Reserved<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- IP PARAMS TABLE -->\n    <div style=\"margin-top:40px;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:16px;\">\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px;\">📋 Bảng thông số IP<\u002Fspan>\n        <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#9C98AE; font-style:italic; font-size:14px;\">IP parameters cheat-sheet<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border:2px solid #ECE4D6; border-radius:18px; overflow:hidden; box-shadow:5px 5px 0 rgba(23,24,59,0.05); font-size:14px;\">\n        <div style=\"display:grid; grid-template-columns:1.1fr 1fr 1.4fr; background:#17183B; color:#fff; font-family:'Space Grotesk',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em;\">\n          <div style=\"padding:12px 18px;\">Thông số · Parameter<\u002Fdiv><div style=\"padding:12px 18px;\">Giá trị · Value<\u002Fdiv><div style=\"padding:12px 18px;\">Ghi chú · Note<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ ipRows }}\" as=\"r\" hint-placeholder-count=\"8\"><div style=\"display:grid; grid-template-columns:1.1fr 1fr 1.4fr; border-top:1px solid #F0EADF;\"><div style=\"padding:11px 18px; font-weight:600;\">{{ r.k }}<\u002Fdiv><div style=\"padding:11px 18px; font-family:'JetBrains Mono',monospace; color:#E24E1B;\">{{ r.v }}<\u002Fdiv><div style=\"padding:11px 18px; color:#8A86A0;\">{{ r.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== PART 0 · PREP ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#DEFBF0; color:#05A67B; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 15px; border-radius:99px;\">Phần 0 · Chuẩn bị<\u002Fdiv>\n      <h2 style=\"margin:14px 0 6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;\">Chuẩn bị máy chủ<\u002Fh2>\n      <p style=\"margin:0 0 8px; color:#4A4B6A; font-size:15.5px; max-width:720px; line-height:1.6;\">Trước khi cài dịch vụ, máy chủ cần một địa chỉ IP cố định để client luôn tìm thấy.<\u002Fp>\n      <div style=\"background:#F0FBF6; border:1.5px solid #A9E7CE; border-radius:14px; padding:14px 18px; margin:14px 0 22px; font-size:14px; color:#0B5A3E;\">✅ <b>Cần có:<\u002Fb> Máy ảo chạy Windows Server 2019 (quyền Administrator) · ít nhất 1 máy client Windows 10/11 cùng mạng · card mạng Internal/Host-only.<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <sc-for list=\"{{ prepSteps }}\" as=\"st\" hint-placeholder-count=\"1\"><dc-import name=\"LabStep\" step=\"{{ st }}\" show-english=\"{{ showEnglish }}\" show-gui=\"{{ showGui }}\" show-power-shell=\"{{ showPs }}\" style=\"--accent:#06D6A0\" hint-size=\"100%,360px\"><\u002Fdc-import><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== PART 1 · DHCP ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#FFE7DB; color:#E24E1B; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 15px; border-radius:99px;\">Phần 1 · DHCP<\u002Fdiv>\n      <h2 style=\"margin:14px 0 6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;\">Triển khai DHCP Server<\u002Fh2>\n      <p style=\"margin:0 0 18px; color:#4A4B6A; font-size:15.5px; max-width:720px; line-height:1.6;\">DHCP tự động cấp IP &amp; cấu hình mạng cho thiết bị qua 4 bước <b>DORA<\u002Fb>. Ta sẽ cài role, tạo dải cấp phát rồi cấu hình các tùy chọn.<\u002Fp>\n      <!-- DORA strip -->\n      <div style=\"display:flex; flex-wrap:wrap; align-items:stretch; gap:8px; margin-bottom:24px;\">\n        <div style=\"flex:1; min-width:150px; background:#fff; border:2px solid #FFCBB0; border-radius:16px; padding:14px;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#FF6B35; font-size:13px;\">1 · DISCOVER<\u002Fdiv><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:4px; line-height:1.45;\">Client hỏi: \"Có server nào cấp IP không?\"<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:150px; background:#fff; border:2px solid #FFCBB0; border-radius:16px; padding:14px;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#FF6B35; font-size:13px;\">2 · OFFER<\u002Fdiv><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:4px; line-height:1.45;\">Server đề nghị một IP kèm cấu hình.<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:150px; background:#fff; border:2px solid #FFCBB0; border-radius:16px; padding:14px;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#FF6B35; font-size:13px;\">3 · REQUEST<\u002Fdiv><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:4px; line-height:1.45;\">Client xin dùng IP được đề nghị.<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:150px; background:#fff; border:2px solid #FFCBB0; border-radius:16px; padding:14px;\"><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#FF6B35; font-size:13px;\">4 · ACK<\u002Fdiv><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:4px; line-height:1.45;\">Server xác nhận — client dùng IP.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <sc-for list=\"{{ dhcpSteps }}\" as=\"st\" hint-placeholder-count=\"5\"><dc-import name=\"LabStep\" step=\"{{ st }}\" show-english=\"{{ showEnglish }}\" show-gui=\"{{ showGui }}\" show-power-shell=\"{{ showPs }}\" style=\"--accent:#FF6B35\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== PART 2 · DNS ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#E4EAFF; color:#2E44C7; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 15px; border-radius:99px;\">Phần 2 · DNS<\u002Fdiv>\n      <h2 style=\"margin:14px 0 6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;\">Triển khai DNS Server<\u002Fh2>\n      <p style=\"margin:0 0 18px; color:#4A4B6A; font-size:15.5px; max-width:720px; line-height:1.6;\">DNS dịch tên miền dễ nhớ thành địa chỉ IP. Ta tạo zone <b>lab.local<\u002Fb> rồi thêm các loại bản ghi phổ biến.<\u002Fp>\n      <!-- record legend -->\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;\">\n        <div style=\"flex:1; min-width:160px; background:#fff; border:2px solid #C3D0FF; border-radius:16px; padding:13px 15px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; color:#2E44C7; background:#E4EAFF; padding:2px 8px; border-radius:7px;\">A<\u002Fspan><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:8px; line-height:1.45;\">Tên → địa chỉ <b>IPv4<\u002Fb><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:160px; background:#fff; border:2px solid #C3D0FF; border-radius:16px; padding:13px 15px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; color:#2E44C7; background:#E4EAFF; padding:2px 8px; border-radius:7px;\">AAAA<\u002Fspan><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:8px; line-height:1.45;\">Tên → địa chỉ <b>IPv6<\u002Fb><\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:160px; background:#fff; border:2px solid #C3D0FF; border-radius:16px; padding:13px 15px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; color:#2E44C7; background:#E4EAFF; padding:2px 8px; border-radius:7px;\">CNAME<\u002Fspan><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:8px; line-height:1.45;\">Bí danh trỏ tên khác<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; min-width:160px; background:#fff; border:2px solid #C3D0FF; border-radius:16px; padding:13px 15px;\"><span style=\"font-family:'JetBrains Mono',monospace; font-weight:600; color:#2E44C7; background:#E4EAFF; padding:2px 8px; border-radius:7px;\">MX<\u002Fspan><div style=\"font-size:12.5px; color:#4A4B6A; margin-top:8px; line-height:1.45;\">Máy chủ nhận <b>email<\u002Fb><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <sc-for list=\"{{ dnsSteps }}\" as=\"st\" hint-placeholder-count=\"5\"><dc-import name=\"LabStep\" step=\"{{ st }}\" show-english=\"{{ showEnglish }}\" show-gui=\"{{ showGui }}\" show-power-shell=\"{{ showPs }}\" style=\"--accent:#4361EE\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== PART 3 · CLIENT ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#F3E6FF; color:#7A3DC4; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 15px; border-radius:99px;\">Phần 3 · Kiểm tra<\u002Fdiv>\n      <h2 style=\"margin:14px 0 6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;\">Kiểm tra từ máy client<\u002Fh2>\n      <p style=\"margin:0 0 22px; color:#4A4B6A; font-size:15.5px; max-width:720px; line-height:1.6;\">Giờ hãy đứng ở vị trí người dùng: để client nhận IP tự động, rồi dùng <b>ipconfig<\u002Fb>, <b>nslookup<\u002Fb> và <b>ping<\u002Fb> để xác nhận mọi thứ hoạt động.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <sc-for list=\"{{ clientSteps }}\" as=\"st\" hint-placeholder-count=\"3\"><dc-import name=\"LabStep\" step=\"{{ st }}\" show-english=\"{{ showEnglish }}\" show-gui=\"{{ showGui }}\" show-power-shell=\"{{ showPs }}\" style=\"--accent:#9B5DE5\" hint-size=\"100%,380px\"><\u002Fdc-import><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== TROUBLESHOOTING ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:inline-flex; align-items:center; gap:10px; background:#FFE1EA; color:#C21E56; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:0.1em; text-transform:uppercase; padding:7px 15px; border-radius:99px;\">Xử lý sự cố<\u002Fdiv>\n      <h2 style=\"margin:14px 0 6px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px;\">🔧 Troubleshooting<\u002Fh2>\n      <p style=\"margin:0 0 22px; color:#4A4B6A; font-size:15.5px; max-width:720px; line-height:1.6;\">Gặp lỗi là chuyện bình thường. Dưới đây là các sự cố hay gặp: triệu chứng → nguyên nhân → cách khắc phục.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px;\">\n        <sc-for list=\"{{ troubles }}\" as=\"tb\" hint-placeholder-count=\"5\">\n          <div style=\"background:#fff; border:2px solid #ECE4D6; border-left:8px solid #EF476F; border-radius:18px; padding:18px 20px; box-shadow:4px 5px 0 rgba(23,24,59,0.05);\">\n            <div style=\"display:flex; align-items:center; gap:9px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#C21E56;\"><span style=\"font-size:18px;\">{{ tb.icon }}<\u002Fspan>{{ tb.sym }}<\u002Fdiv>\n            <div style=\"margin-top:12px; font-size:13.5px; line-height:1.55;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#8A86A0;\">Nguyên nhân · <\u002Fspan><span style=\"color:#4A4B6A;\">{{ tb.cause }}<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:8px; font-size:13.5px; line-height:1.55;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#05A67B;\">Khắc phục · <\u002Fspan><span style=\"color:#4A4B6A;\">{{ tb.fix }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== DNS vs DHCP RECAP ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:18px;\">\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;\">⚖️ DNS vs DHCP<\u002Fspan>\n        <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#9C98AE; font-style:italic; font-size:15px;\">Quick comparison<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; gap:18px;\">\n        <div style=\"flex:1; min-width:280px; background:linear-gradient(160deg,#4361EE,#5A73F5); border-radius:22px; padding:26px; color:#fff; box-shadow:6px 7px 0 rgba(23,24,59,0.15);\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;\">🌐 DNS<\u002Fdiv>\n          <div style=\"margin-top:16px; display:flex; flex-direction:column; gap:11px; font-size:14.5px;\">\n            <div>🎯 <b>Nhiệm vụ:<\u002Fb> dịch tên miền ↔ địa chỉ IP<\u002Fdiv>\n            <div>🔌 <b>Cổng:<\u002Fb> 53<\u002Fdiv>\n            <div>🗣️ <b>Ví von:<\u002Fb> tra \"danh bạ\" Internet<\u002Fdiv>\n            <div>❓ <b>Trả lời:<\u002Fb> \"example.com ở đâu?\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1; min-width:280px; background:linear-gradient(160deg,#FF6B35,#FF8A4D); border-radius:22px; padding:26px; color:#fff; box-shadow:6px 7px 0 rgba(23,24,59,0.15);\">\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px;\">⚙️ DHCP<\u002Fdiv>\n          <div style=\"margin-top:16px; display:flex; flex-direction:column; gap:11px; font-size:14.5px;\">\n            <div>🎯 <b>Nhiệm vụ:<\u002Fb> cấp phát IP &amp; cấu hình tự động<\u002Fdiv>\n            <div>🔌 <b>Cổng:<\u002Fb> 67 / 68<\u002Fdiv>\n            <div>🗣️ <b>Ví von:<\u002Fb> \"phát địa chỉ nhà\" cho thiết bị<\u002Fdiv>\n            <div>❓ <b>Trả lời:<\u002Fb> \"IP của tôi là gì?\"<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== QUIZ ===== -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:flex; align-items:baseline; gap:12px; margin-bottom:6px; flex-wrap:wrap;\">\n        <span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;\">🧠 Ôn tập nhanh<\u002Fspan>\n        <sc-if value=\"{{ showEnglish }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#9C98AE; font-style:italic; font-size:15px;\">Quick quiz<\u002Fspan><\u002Fsc-if>\n        <span style=\"margin-left:auto; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#7A3DC4; background:#F3E6FF; padding:6px 14px; border-radius:99px;\">Điểm: {{ quizScore }}/{{ quizTotal }}<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px; color:#4A4B6A; font-size:15px;\">Chọn đáp án đúng — bấm để xem kết quả ngay.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:18px;\">\n        <sc-for list=\"{{ quizQuestions }}\" as=\"q\" hint-placeholder-count=\"5\">\n          <div style=\"background:#fff; border:2px solid #ECE4D6; border-radius:20px; padding:22px; box-shadow:5px 5px 0 rgba(23,24,59,0.05);\">\n            <div style=\"display:flex; gap:10px; align-items:flex-start;\"><span style=\"flex:none; width:30px; height:30px; border-radius:9px; background:#F3E6FF; color:#7A3DC4; font-family:'Space Grotesk',sans-serif; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:14px;\">{{ q.n }}<\u002Fspan><div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16.5px; line-height:1.4; padding-top:3px;\">{{ q.q }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-top:16px;\">\n              <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ opt.onPick }}\" style=\"cursor:pointer; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:8px; background: {{ opt.bg }}; border:2px solid {{ opt.bd }}; color: {{ opt.fg }}; border-radius:13px; padding:12px 15px; font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; transition:all .15s;\"><span>{{ opt.text }}<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700;\">{{ opt.mark }}<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ q.answered }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:14px; background:#FBF7F0; border-radius:12px; padding:12px 15px; font-size:13.5px; color:#4A4B6A; line-height:1.55;\"><span style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#7A3DC4;\">Giải thích · <\u002Fspan>{{ q.explain }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== RECAP ===== -->\n    <div style=\"margin-top:64px; background:#17183B; border-radius:26px; padding:38px 34px; color:#fff; box-shadow:7px 8px 0 rgba(23,24,59,0.15);\">\n      <div style=\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px;\">✅ Tóm tắt bài lab · Recap<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:22px;\">\n        <div style=\"background:rgba(255,255,255,0.06); border-radius:14px; padding:16px; font-size:14px; line-height:1.55;\"><span style=\"color:#06D6A0; font-weight:700;\">✔<\u002Fspan> DHCP cấp IP tự động qua 4 bước DORA và cấu hình scope, options, reservation.<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.06); border-radius:14px; padding:16px; font-size:14px; line-height:1.55;\"><span style=\"color:#6C8BFF; font-weight:700;\">✔<\u002Fspan> DNS phân giải tên → IP với các bản ghi A, AAAA, CNAME, MX trong zone lab.local.<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.06); border-radius:14px; padding:16px; font-size:14px; line-height:1.55;\"><span style=\"color:#FF9558; font-weight:700;\">✔<\u002Fspan> Option 006 giúp DHCP cấp luôn địa chỉ DNS server cho client.<\u002Fdiv>\n        <div style=\"background:rgba(255,255,255,0.06); border-radius:14px; padding:16px; font-size:14px; line-height:1.55;\"><span style=\"color:#C58BFF; font-weight:700;\">✔<\u002Fspan> ipconfig, nslookup, ping xác nhận DORA và phân giải tên hoạt động đúng.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.12); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#9AA0C8;\">\n        <span style=\"letter-spacing:0.15em;\">M O D U L E  M Ạ N G · N E T W O R K I N G  B A S I C S<\u002Fspan>\n        <span>Dựa trên module DNS &amp; DHCP · Yên Nguyễn<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showEnglish&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hiển thị&quot;},&quot;showGui&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hiển thị&quot;},&quot;showPowerShell&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hiển thị&quot;}}\">\nclass Component extends DCLogic {\n  state = { done: {}, quiz: {} };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem('lab_dns_dhcp_v1');\n      if (raw) this.setState({ done: JSON.parse(raw) || {} });\n    } catch (e) {}\n  }\n  persist(done) { try { localStorage.setItem('lab_dns_dhcp_v1', JSON.stringify(done)); } catch (e) {} }\n  toggle = (id) => {\n    this.setState(s => { const done = { ...s.done, [id]: !s.done[id] }; this.persist(done); return { done }; });\n  };\n  onReset = () => { this.persist({}); this.setState({ done: {} }); };\n  pick = (qi, oi) => { this.setState(s => ({ quiz: { ...s.quiz, [qi]: oi } })); };\n\n  buildRaw() {\n    const c = { cmd: '#7CE7B0', out: '#CDD2F0', ok: '#5FE0A0', warn: '#FFD27A', mut: '#6E739E', hi: '#8FB4FF' };\n    return {\n      prep: [\n        { id: 'p0', num: '0', titleVi: 'Đặt IP tĩnh cho máy chủ SRV-01', titleEn: 'Assign a static IP to the server',\n          intro: 'Máy chủ chạy DHCP/DNS bắt buộc phải có IP tĩnh — nếu để tự động, client sẽ mất phương hướng khi IP server đổi. Đặt IP 192.168.100.10 và trỏ DNS về chính nó (127.0.0.1).',\n          introEn: 'A DHCP/DNS server must have a fixed IP so clients can always find it.',\n          gui: ['Mở Control Panel → Network and Sharing Center → Change adapter settings.', 'Chuột phải card mạng → Properties → chọn Internet Protocol Version 4 (TCP/IPv4).', 'Chọn \"Use the following IP address\": IP 192.168.100.10, Mask 255.255.255.0, Gateway 192.168.100.1.', 'Preferred DNS server: 127.0.0.1 → OK.'],\n          ps: 'New-NetIPAddress -InterfaceAlias \"Ethernet\" `\\n  -IPAddress 192.168.100.10 `\\n  -PrefixLength 24 -DefaultGateway 192.168.100.1\\n\\nSet-DnsClientServerAddress -InterfaceAlias \"Ethernet\" `\\n  -ServerAddresses 127.0.0.1\\n\\nRename-Computer -NewName \"SRV-01\" -Restart',\n          terminal: { title: 'PS C:\\\\> Get-NetIPConfiguration', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-NetIPConfiguration' }, { c: c.out, t: '' },\n            { c: c.hi, t: 'InterfaceAlias       : Ethernet' },\n            { c: c.out, t: 'IPv4Address          : 192.168.100.10' },\n            { c: c.out, t: 'IPv4DefaultGateway   : 192.168.100.1' },\n            { c: c.out, t: 'DNSServer            : 127.0.0.1' },\n            { c: c.ok, t: 'NetAdapter.Status    : Up' } ] },\n          tip: { type: 'danger', vi: 'Đừng bao giờ để máy chủ tự lấy IP qua DHCP.', en: 'Never let the server itself obtain its IP via DHCP.' } },\n      ],\n      dhcp: [\n        { id: 'd1', num: '1', titleVi: 'Cài đặt vai trò DHCP Server', titleEn: 'Install the DHCP Server role',\n          intro: 'Thêm role DHCP để máy chủ có thể cấp phát IP, kèm công cụ quản lý (DHCP console) để cấu hình bằng giao diện.',\n          introEn: 'Add the DHCP role so the server can hand out addresses.',\n          gui: ['Server Manager → Manage → Add Roles and Features.', 'Chọn Role-based installation → chọn máy chủ hiện tại.', 'Tích DHCP Server → Add Features → Next đến hết → Install.'],\n          ps: 'Install-WindowsFeature -Name DHCP -IncludeManagementTools',\n          terminal: { title: 'Install-WindowsFeature', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Install-WindowsFeature -Name DHCP -IncludeManagementTools' }, { c: c.out, t: '' },\n            { c: c.out, t: 'Success  Restart Needed  Exit Code   Feature Result' },\n            { c: c.out, t: '-------  -------------  ---------   --------------' },\n            { c: c.ok, t: 'True     No             Success     {DHCP Server, ...}' } ] },\n          tip: { type: 'tip', vi: '-IncludeManagementTools cài luôn bảng điều khiển DHCP để thao tác bằng GUI.', en: '-IncludeManagementTools also installs the DHCP console.' } },\n        { id: 'd2', num: '2', titleVi: 'Authorize & khởi tạo dịch vụ DHCP', titleEn: 'Authorize the DHCP server',\n          intro: 'Trong môi trường Active Directory, DHCP phải được \"authorize\" thì mới được phép cấp IP. Bước này cũng tạo các security group cần thiết.',\n          introEn: 'In a domain, DHCP must be authorized in AD before it can lease.',\n          gui: ['Sau khi cài, bấm cờ cảnh báo ⚑ trong Server Manager → Complete DHCP Configuration.', 'Chạy wizard: chỉ định tài khoản Domain Admin để Authorize.', 'Bấm Commit → Close.'],\n          ps: '# Ủy quyền DHCP trong Active Directory\\nAdd-DhcpServerInDC -DnsName \"SRV-01.lab.local\" -IPAddress 192.168.100.10\\n\\n# Tạo security groups & khởi động lại dịch vụ\\nnetsh dhcp add securitygroups\\nRestart-Service dhcpserver',\n          terminal: { title: 'Get-DhcpServerInDC', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DhcpServerInDC' }, { c: c.out, t: '' },\n            { c: c.out, t: 'IPAddress        DnsName' }, { c: c.out, t: '---------        -------' },\n            { c: c.ok, t: '192.168.100.10   SRV-01.lab.local' } ] },\n          tip: { type: 'warn', vi: 'Chưa authorize thì DHCP sẽ không cấp IP dù scope đã bật.', en: 'Without authorization DHCP will not lease even if the scope is active.' } },\n        { id: 'd3', num: '3', titleVi: 'Tạo Scope — dải IP cấp phát', titleEn: 'Create a scope (address pool)',\n          intro: 'Scope là dải IP mà DHCP được phép cho thuê. Ta tạo scope 192.168.100.100 → .200, chừa các IP thấp cho thiết bị tĩnh.',\n          introEn: 'A scope is the range of addresses DHCP may lease out.',\n          gui: ['DHCP console → mở rộng máy chủ → chuột phải IPv4 → New Scope.', 'Đặt tên \"LAB-Scope\". Start 192.168.100.100, End 192.168.100.200.', 'Length /24, Subnet mask 255.255.255.0.', 'Thêm Exclusions nếu cần. Lease 8 ngày.', 'Chọn Activate this scope now → Finish.'],\n          ps: 'Add-DhcpServerv4Scope -Name \"LAB-Scope\" `\\n  -StartRange 192.168.100.100 `\\n  -EndRange 192.168.100.200 `\\n  -SubnetMask 255.255.255.0 `\\n  -LeaseDuration 8.00:00:00 -State Active',\n          terminal: { title: 'Get-DhcpServerv4Scope', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DhcpServerv4Scope' }, { c: c.out, t: '' },\n            { c: c.out, t: 'ScopeId         Name        State   StartRange        EndRange' },\n            { c: c.out, t: '-------         ----        -----   ----------        --------' },\n            { c: c.ok, t: '192.168.100.0   LAB-Scope   Active  192.168.100.100   192.168.100.200' } ] },\n          tip: { type: 'tip', vi: 'Lease 8 ngày hợp mạng ổn định; wifi khách nên đặt ngắn hơn (vài giờ).', en: '8-day lease suits stable LANs; use shorter for guest Wi-Fi.' } },\n        { id: 'd4', num: '4', titleVi: 'Cấu hình Scope Options (Gateway · DNS · Domain)', titleEn: 'Configure scope options',\n          intro: 'Đây là bước DHCP \"chỉ đường\" cho client: cấp Default Gateway (003), DNS Server (006) và DNS Domain Name (015). Nhờ Option 006, client tự biết dùng DNS 192.168.100.10.',\n          introEn: 'Here DHCP also hands clients their gateway, DNS server (option 006) and domain.',\n          gui: ['Trong scope LAB-Scope → chuột phải Scope Options → Configure Options.', '003 Router → 192.168.100.1.', '006 DNS Servers → 192.168.100.10.', '015 DNS Domain Name → lab.local → OK.'],\n          ps: 'Set-DhcpServerv4OptionValue -ScopeId 192.168.100.0 `\\n  -Router 192.168.100.1 `\\n  -DnsServer 192.168.100.10 `\\n  -DnsDomain \"lab.local\"',\n          terminal: { title: 'Get-DhcpServerv4OptionValue', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DhcpServerv4OptionValue -ScopeId 192.168.100.0' }, { c: c.out, t: '' },\n            { c: c.out, t: 'OptionId  Name              Value' }, { c: c.out, t: '--------  ----              -----' },\n            { c: c.out, t: '3         Router            192.168.100.1' },\n            { c: c.hi, t: '6         DNS Servers       192.168.100.10' },\n            { c: c.out, t: '15        DNS Domain Name   lab.local' } ] },\n          tip: { type: 'tip', vi: 'Option 006 chính là cầu nối DHCP → DNS: client nhận IP xong biết luôn hỏi DNS ở đâu.', en: 'Option 006 is the DHCP→DNS bridge.' } },\n        { id: 'd5', num: '5', titleVi: 'Tạo Reservation — IP cố định theo MAC', titleEn: 'Create a reservation',\n          intro: 'Reservation gán vĩnh viễn một IP cho một thiết bị dựa theo địa chỉ MAC — dùng cho máy in, camera, server nhỏ cần IP không đổi mà vẫn quản lý tập trung.',\n          introEn: 'A reservation permanently ties an IP to a device by its MAC.',\n          gui: ['Trong scope → chuột phải Reservations → New Reservation.', 'Reservation name: Printer-01. IP: 192.168.100.50.', 'MAC address: 00-15-5D-01-02-03 (lấy từ ipconfig /all của thiết bị).', 'Bấm Add → Close.'],\n          ps: 'Add-DhcpServerv4Reservation -ScopeId 192.168.100.0 `\\n  -IPAddress 192.168.100.50 `\\n  -ClientId \"00-15-5D-01-02-03\" `\\n  -Name \"Printer-01\" -Description \"May in phong ke toan\"',\n          terminal: { title: 'Get-DhcpServerv4Reservation', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DhcpServerv4Reservation -ScopeId 192.168.100.0' }, { c: c.out, t: '' },\n            { c: c.out, t: 'IPAddress        ClientId            Name' }, { c: c.out, t: '---------        --------            ----' },\n            { c: c.ok, t: '192.168.100.50   00-15-5d-01-02-03   Printer-01' } ] },\n          tip: { type: 'tip', vi: 'Lấy MAC bằng lệnh ipconfig /all trên thiết bị (dòng Physical Address).', en: 'Get the MAC via ipconfig /all (Physical Address).' } },\n      ],\n      dns: [\n        { id: 'n1', num: '6', titleVi: 'Cài đặt vai trò DNS Server', titleEn: 'Install the DNS Server role',\n          intro: 'Thêm role DNS để máy chủ có thể phân giải tên miền nội bộ như web.lab.local thành địa chỉ IP.',\n          introEn: 'Add the DNS role so the server can resolve internal names.',\n          gui: ['Server Manager → Add Roles and Features.', 'Tích DNS Server → Add Features → Next → Install.'],\n          ps: 'Install-WindowsFeature -Name DNS -IncludeManagementTools',\n          terminal: { title: 'Install-WindowsFeature', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Install-WindowsFeature -Name DNS -IncludeManagementTools' }, { c: c.out, t: '' },\n            { c: c.out, t: 'Success  Restart Needed  Exit Code   Feature Result' },\n            { c: c.ok, t: 'True     No             Success     {DNS Server, ...}' } ] },\n          tip: { type: 'tip', vi: 'Nếu máy đã là Domain Controller (AD DS) thì DNS thường đã được cài sẵn.', en: 'On a Domain Controller, DNS is usually already installed.' } },\n        { id: 'n2', num: '7', titleVi: 'Tạo Forward Lookup Zone (lab.local)', titleEn: 'Create a forward lookup zone',\n          intro: 'Forward Lookup Zone là \"cuốn danh bạ\" chứa các bản ghi ánh xạ tên → IP cho tên miền lab.local.',\n          introEn: 'A forward lookup zone holds the name→IP records for your domain.',\n          gui: ['DNS Manager → chuột phải Forward Lookup Zones → New Zone.', 'Chọn Primary zone → tên zone: lab.local.', 'Tạo file zone mới → Do not allow dynamic updates → Finish.'],\n          ps: 'Add-DnsServerPrimaryZone -Name \"lab.local\" -ZoneFile \"lab.local.dns\"',\n          terminal: { title: 'Get-DnsServerZone', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DnsServerZone -Name lab.local' }, { c: c.out, t: '' },\n            { c: c.out, t: 'ZoneName    ZoneType   IsAutoCreated   IsDsIntegrated' },\n            { c: c.out, t: '--------    --------   -------------   --------------' },\n            { c: c.ok, t: 'lab.local   Primary    False           False' } ] },\n          tip: { type: 'warn', vi: 'Tên zone phải khớp với Option 015 (DNS Domain Name) đã cấu hình ở DHCP.', en: 'The zone name must match DHCP option 015.' } },\n        { id: 'n3', num: '8', titleVi: 'Tạo bản ghi A và AAAA', titleEn: 'Create A and AAAA records',\n          intro: 'Bản ghi A ánh xạ tên → IPv4, AAAA ánh xạ tên → IPv6. Tạo web.lab.local trỏ tới máy chủ web.',\n          introEn: 'A maps a name to IPv4; AAAA maps a name to IPv6.',\n          gui: ['Trong zone lab.local → chuột phải → New Host (A or AAAA).', 'Name: web. IP: 192.168.100.20 → Add Host (bản ghi A).', 'Lặp lại với IPv6 2001:db8::20 để tạo bản ghi AAAA.'],\n          ps: 'Add-DnsServerResourceRecordA -ZoneName \"lab.local\" `\\n  -Name \"web\" -IPv4Address 192.168.100.20\\n\\nAdd-DnsServerResourceRecordAAAA -ZoneName \"lab.local\" `\\n  -Name \"web\" -IPv6Address \"2001:db8::20\"',\n          terminal: { title: 'Get-DnsServerResourceRecord', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DnsServerResourceRecord -ZoneName lab.local -Name web' }, { c: c.out, t: '' },\n            { c: c.out, t: 'HostName  RecordType  RecordData' }, { c: c.out, t: '--------  ----------  ----------' },\n            { c: c.ok, t: 'web       A           192.168.100.20' },\n            { c: c.ok, t: 'web       AAAA        2001:db8::20' } ] },\n          tip: { type: 'tip', vi: 'Nhớ: A = IPv4 (một chữ A), AAAA = IPv6 (bốn chữ A).', en: 'A = IPv4, AAAA = IPv6.' } },\n        { id: 'n4', num: '9', titleVi: 'Tạo bản ghi CNAME (bí danh)', titleEn: 'Create a CNAME (alias) record',\n          intro: 'CNAME là biệt danh trỏ tới một tên khác. Ta cho www.lab.local trỏ tới web.lab.local — đổi IP của web thì www tự trỏ theo.',\n          introEn: 'A CNAME is an alias pointing to another name.',\n          gui: ['Trong zone → chuột phải → New Alias (CNAME).', 'Alias name: www. Target host: web.lab.local.', 'Bấm OK.'],\n          ps: 'Add-DnsServerResourceRecordCName -ZoneName \"lab.local\" `\\n  -Name \"www\" -HostNameAlias \"web.lab.local\"',\n          terminal: { title: 'Get-DnsServerResourceRecord', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DnsServerResourceRecord -ZoneName lab.local -RRType CName' }, { c: c.out, t: '' },\n            { c: c.out, t: 'HostName  RecordType  RecordData' }, { c: c.out, t: '--------  ----------  ----------' },\n            { c: c.ok, t: 'www       CNAME       web.lab.local.' } ] },\n          tip: { type: 'tip', vi: 'CNAME giúp đổi hạ tầng dễ dàng: sửa một bản ghi A là mọi bí danh trỏ theo.', en: 'Change one A record and every alias follows.' } },\n        { id: 'n5', num: '10', titleVi: 'Tạo bản ghi MX (máy chủ mail)', titleEn: 'Create an MX (mail) record',\n          intro: 'Bản ghi MX chỉ định máy chủ nhận email cho tên miền. Tạo bản ghi A cho mail rồi thêm MX với priority 10.',\n          introEn: 'An MX record designates the mail server for the domain.',\n          gui: ['Tạo trước bản ghi A: mail → 192.168.100.25.', 'Trong zone → chuột phải → Other New Records → Mail Exchanger (MX).', 'Mail server: mail.lab.local. Priority: 10 → OK.'],\n          ps: 'Add-DnsServerResourceRecordA -ZoneName \"lab.local\" `\\n  -Name \"mail\" -IPv4Address 192.168.100.25\\n\\nAdd-DnsServerResourceRecordMX -ZoneName \"lab.local\" `\\n  -Name \".\" -MailExchange \"mail.lab.local\" -Preference 10',\n          terminal: { title: 'Get-DnsServerResourceRecord', lines: [\n            { c: c.cmd, t: 'PS C:\\\\> Get-DnsServerResourceRecord -ZoneName lab.local -RRType Mx' }, { c: c.out, t: '' },\n            { c: c.out, t: 'HostName  RecordType  RecordData' }, { c: c.out, t: '--------  ----------  ----------' },\n            { c: c.ok, t: '@         MX          [10] mail.lab.local.' } ] },\n          tip: { type: 'tip', vi: 'Priority càng nhỏ càng ưu tiên: MX 10 được thử trước MX 20.', en: 'Lower preference value = higher priority.' } },\n      ],\n      client: [\n        { id: 'c1', num: '11', titleVi: 'Client nhận IP tự động (kết quả DORA)', titleEn: 'Client obtains an IP (DORA in action)',\n          intro: 'Trên máy client (Windows 10/11), đặt card mạng ở chế độ tự động rồi làm mới IP. Client sẽ chạy DORA và nhận IP từ scope.',\n          introEn: 'Set the client to automatic, then renew — it runs DORA and gets a lease.',\n          gui: ['Trên client: Network settings → IPv4 → Obtain an IP address automatically.', 'Mở Command Prompt (cmd) với quyền Admin.', 'Chạy ipconfig /release rồi ipconfig /renew.'],\n          ps: 'ipconfig /release\\nipconfig /renew\\nipconfig /all',\n          terminal: { title: 'C:\\\\> ipconfig /all', lines: [\n            { c: c.cmd, t: 'C:\\\\> ipconfig /all' }, { c: c.out, t: '' },\n            { c: c.hi, t: '   Ethernet adapter Ethernet:' },\n            { c: c.out, t: '   DHCP Enabled . . . . . . . . . : Yes' },\n            { c: c.ok, t: '   IPv4 Address . . . . . . . . . : 192.168.100.101 (Preferred)' },\n            { c: c.out, t: '   Subnet Mask  . . . . . . . . . : 255.255.255.0' },\n            { c: c.out, t: '   Default Gateway  . . . . . . . : 192.168.100.1' },\n            { c: c.out, t: '   DHCP Server  . . . . . . . . . : 192.168.100.10' },\n            { c: c.out, t: '   DNS Servers  . . . . . . . . . : 192.168.100.10' },\n            { c: c.mut, t: '   Lease Obtained . . . . . . . . : Sat, Jul 5 2026 09:14:02' },\n            { c: c.mut, t: '   Lease Expires  . . . . . . . . : Sun, Jul 13 2026 09:14:02' } ] },\n          tip: { type: 'tip', vi: 'Thấy \"DHCP Enabled: Yes\" cùng Lease Obtained/Expires nghĩa là DORA đã hoàn tất.', en: '\"DHCP Enabled: Yes\" plus lease dates means DORA finished.' } },\n        { id: 'c2', num: '12', titleVi: 'Kiểm tra phân giải DNS (nslookup)', titleEn: 'Test name resolution with nslookup',\n          intro: 'nslookup hỏi trực tiếp DNS server để kiểm tra các bản ghi vừa tạo. Thử A, CNAME và MX.',\n          introEn: 'nslookup queries the DNS server directly to verify your records.',\n          gui: ['Mở Command Prompt trên client.', 'Chạy lần lượt các lệnh nslookup bên cạnh.'],\n          ps: 'nslookup web.lab.local\\nnslookup www.lab.local\\nnslookup -type=MX lab.local',\n          terminal: { title: 'C:\\\\> nslookup', lines: [\n            { c: c.cmd, t: 'C:\\\\> nslookup web.lab.local' },\n            { c: c.out, t: 'Server:   SRV-01.lab.local' }, { c: c.out, t: 'Address:  192.168.100.10' },\n            { c: c.ok, t: 'Name:     web.lab.local' }, { c: c.ok, t: 'Address:  192.168.100.20' }, { c: c.out, t: '' },\n            { c: c.cmd, t: 'C:\\\\> nslookup www.lab.local' },\n            { c: c.out, t: 'Name:     web.lab.local' }, { c: c.hi, t: 'Aliases:  www.lab.local' }, { c: c.out, t: '' },\n            { c: c.cmd, t: 'C:\\\\> nslookup -type=MX lab.local' },\n            { c: c.ok, t: 'lab.local  MX preference = 10, mail exchanger = mail.lab.local' } ] },\n          tip: { type: 'tip', vi: 'nslookup hỏi thẳng DNS nên tách được lỗi DNS ra khỏi lỗi mạng.', en: 'nslookup isolates DNS issues from network issues.' } },\n        { id: 'c3', num: '13', titleVi: 'Kiểm tra kết nối (ping)', titleEn: 'Test connectivity with ping',\n          intro: 'ping vừa kiểm tra kết nối vừa xác nhận DNS phân giải đúng: ping bằng tên phải ra đúng IP.',\n          introEn: 'ping checks connectivity and confirms DNS resolves correctly.',\n          gui: ['Mở Command Prompt trên client.', 'ping bằng tên miền và ping bằng IP để so sánh.'],\n          ps: 'ping web.lab.local\\nping 192.168.100.10',\n          terminal: { title: 'C:\\\\> ping web.lab.local', lines: [\n            { c: c.cmd, t: 'C:\\\\> ping web.lab.local' }, { c: c.out, t: '' },\n            { c: c.out, t: 'Pinging web.lab.local [192.168.100.20] with 32 bytes of data:' },\n            { c: c.ok, t: 'Reply from 192.168.100.20: bytes=32 time<1ms TTL=128' },\n            { c: c.ok, t: 'Reply from 192.168.100.20: bytes=32 time<1ms TTL=128' }, { c: c.out, t: '' },\n            { c: c.out, t: '    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss)' } ] },\n          tip: { type: 'warn', vi: 'Ping IP OK nhưng ping tên fail → lỗi ở DNS, không phải mạng.', en: 'Ping IP works but ping name fails ⇒ DNS problem, not network.' } },\n      ],\n    };\n  }\n\n  troublesData() {\n    return [\n      { icon: '📵', sym: 'Client không nhận được IP', cause: 'DHCP chưa authorize, scope chưa Active, hoặc client khác VLAN/subnet.', fix: 'Authorize DHCP trong AD, Activate scope, kiểm tra kết nối lớp 2 hoặc cấu hình DHCP Relay.' },\n      { icon: '🔢', sym: 'Client nhận IP 169.254.x.x (APIPA)', cause: 'Client không liên lạc được với DHCP server.', fix: 'Kiểm tra dịch vụ dhcpserver đang chạy; mở firewall UDP 67/68; kiểm tra dây & switch.' },\n      { icon: '🌐', sym: 'Ping IP được, ping tên thất bại', cause: 'Lỗi DNS: sai Option 006, thiếu bản ghi A, hoặc dịch vụ DNS dừng.', fix: 'Kiểm tra Option 006 = 192.168.100.10, tạo/kiểm bản ghi A, restart dịch vụ DNS.' },\n      { icon: '❔', sym: 'nslookup báo \"server can\\'t find\"', cause: 'Thiếu bản ghi hoặc sai tên zone.', fix: 'Tạo bản ghi tương ứng; đảm bảo tên zone khớp lab.local.' },\n      { icon: '⚡', sym: 'Xung đột IP / IP trùng', cause: 'Thiết bị đặt IP tĩnh nằm trong dải scope, hoặc hai scope chồng lấn.', fix: 'Thêm Exclusion Range cho các IP tĩnh; tránh hai scope cùng dải.' },\n    ];\n  }\n\n  quizData() {\n    return [\n      { q: 'DNS sử dụng cổng (port) nào?', options: [{ text: '53', correct: true }, { text: '67', correct: false }, { text: '80', correct: false }, { text: '443', correct: false }], explain: 'DNS hoạt động trên cổng 53. DHCP dùng cổng 67/68.' },\n      { q: 'Thứ tự đúng của quy trình DORA là gì?', options: [{ text: 'Discover → Offer → Request → Acknowledge', correct: true }, { text: 'Offer → Discover → Ack → Request', correct: false }, { text: 'Request → Offer → Discover → Ack', correct: false }, { text: 'Discover → Request → Offer → Ack', correct: false }], explain: 'DORA = Discover → Offer → Request → Acknowledge.' },\n      { q: 'Bản ghi nào ánh xạ tên miền → địa chỉ IPv6?', options: [{ text: 'AAAA', correct: true }, { text: 'A', correct: false }, { text: 'CNAME', correct: false }, { text: 'MX', correct: false }], explain: 'A dùng cho IPv4, còn AAAA dùng cho IPv6.' },\n      { q: 'Option DHCP nào cấp địa chỉ DNS server cho client?', options: [{ text: '006 DNS Servers', correct: true }, { text: '003 Router', correct: false }, { text: '015 DNS Domain Name', correct: false }, { text: '051 Lease Time', correct: false }], explain: 'Option 006 (DNS Servers) chính là cầu nối DHCP → DNS.' },\n      { q: 'Ping IP thành công nhưng ping tên miền thất bại — lỗi nằm ở đâu?', options: [{ text: 'DNS', correct: true }, { text: 'Cáp mạng', correct: false }, { text: 'DHCP scope', correct: false }, { text: 'Firewall client', correct: false }], explain: 'Mạng vẫn thông (ping IP OK) nên vấn đề nằm ở khâu phân giải tên — tức DNS.' },\n    ];\n  }\n\n  renderVals() {\n    const raw = this.buildRaw();\n    const withState = (arr) => arr.map(s => ({ ...s, done: !!this.state.done[s.id], onToggle: () => this.toggle(s.id) }));\n    const all = [...raw.prep, ...raw.dhcp, ...raw.dns, ...raw.client];\n    const total = all.length;\n    const doneCount = all.filter(s => this.state.done[s.id]).length;\n\n    const qd = this.quizData();\n    let quizScore = 0;\n    const quizQuestions = qd.map((q, qi) => {\n      const sel = this.state.quiz[qi];\n      const answered = sel !== undefined && sel !== null;\n      if (answered && q.options[sel].correct) quizScore++;\n      const options = q.options.map((o, oi) => {\n        let bg = '#FBF7F0', bd = '#E4DCCC', fg = '#3A3B57', mark = '';\n        if (answered) {\n          if (o.correct) { bg = '#E4FBF0'; bd = '#7CE0B4'; fg = '#0B5A3E'; mark = '✓'; }\n          if (oi === sel && !o.correct) { bg = '#FFE9EF'; bd = '#FFB3C8'; fg = '#9A1F45'; mark = '✗'; }\n        }\n        return { text: o.text, bg, bd, fg, mark, onPick: () => this.pick(qi, oi) };\n      });\n      return { n: qi + 1, q: q.q, options, answered, explain: q.explain };\n    });\n\n    return {\n      percent: total ? Math.round(doneCount / total * 100) : 0,\n      doneCount, total,\n      onReset: this.onReset,\n      showEnglish: this.props.showEnglish !== false,\n      showGui: this.props.showGui !== false,\n      showPs: this.props.showPowerShell !== false,\n      prepSteps: withState(raw.prep),\n      dhcpSteps: withState(raw.dhcp),\n      dnsSteps: withState(raw.dns),\n      clientSteps: withState(raw.client),\n      troubles: this.troublesData(),\n      quizQuestions,\n      quizScore,\n      quizTotal: qd.length,\n      ipRows: [\n        { k: 'Domain nội bộ', v: 'lab.local', n: 'Tên miền của mạng lab' },\n        { k: 'Máy chủ SRV-01', v: '192.168.100.10', n: 'IP tĩnh · Static' },\n        { k: 'Subnet mask', v: '255.255.255.0 (/24)', n: '254 địa chỉ khả dụng' },\n        { k: 'Default gateway', v: '192.168.100.1', n: 'Router ra ngoài' },\n        { k: 'DNS server', v: '192.168.100.10', n: 'Chính máy chủ này' },\n        { k: 'DHCP scope', v: '192.168.100.100 – .200', n: 'Dải cấp phát tự động' },\n        { k: 'Reservation', v: '192.168.100.50', n: 'Printer-01 (theo MAC)' },\n        { k: 'Lease duration', v: '8 ngày · days', n: 'Thời hạn thuê IP' },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n<script>\n(function(){\n  var TPL = \"\\n<div style=\\\"--accent:#FF6B35; font-family:'DM Sans',system-ui,sans-serif; background:#ffffff; border:2px solid #ECE4D6; border-left:9px solid var(--accent); border-radius:22px; padding:26px; box-shadow:7px 8px 0 rgba(23,24,59,0.06); display:flex; flex-direction:column; gap:18px;\\\">\\n\\n  <div style=\\\"display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;\\\">\\n    <div style=\\\"display:flex; align-items:center; gap:14px;\\\">\\n      <div style=\\\"flex:none; width:52px; height:52px; border-radius:16px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; box-shadow:3px 3px 0 rgba(23,24,59,0.18);\\\">{{ step.num }}<\\/div>\\n      <div>\\n        <div style=\\\"font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#17183B; line-height:1.25;\\\">{{ step.titleVi }}<\\/div>\\n        <sc-if value=\\\"{{ showEnglish }}\\\" hint-placeholder-val=\\\"{{ true }}\\\"><div style=\\\"font-size:13px; color:#8A86A0; font-style:italic; margin-top:2px;\\\">{{ step.titleEn }}<\\/div><\\/sc-if>\\n      <\\/div>\\n    <\\/div>\\n    <sc-if value=\\\"{{ done }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n      <button onClick=\\\"{{ step.onToggle }}\\\" style=\\\"flex:none; cursor:pointer; border:2px solid #06B389; background:#06D6A0; color:#0B3A2E; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; padding:9px 15px; border-radius:12px; box-shadow:2px 2px 0 rgba(23,24,59,0.12);\\\">✓ Đã xong<\\/button>\\n    <\\/sc-if>\\n    <sc-if value=\\\"{{ notDone }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n      <button onClick=\\\"{{ step.onToggle }}\\\" style=\\\"flex:none; cursor:pointer; border:2px solid #E4DCCC; background:#F6F1E7; color:#8A86A0; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; padding:9px 15px; border-radius:12px;\\\">○ Đánh dấu xong<\\/button>\\n    <\\/sc-if>\\n  <\\/div>\\n\\n  <div>\\n    <p style=\\\"margin:0; color:#4A4B6A; font-size:15px; line-height:1.65;\\\">{{ step.intro }}<\\/p>\\n    <sc-if value=\\\"{{ showEnglish }}\\\" hint-placeholder-val=\\\"{{ true }}\\\"><p style=\\\"margin:6px 0 0; color:#9C98AE; font-size:13.5px; line-height:1.55; font-style:italic;\\\">{{ step.introEn }}<\\/p><\\/sc-if>\\n  <\\/div>\\n\\n  <div style=\\\"display:flex; flex-wrap:wrap; gap:16px;\\\">\\n    <sc-if value=\\\"{{ showGui }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n      <div style=\\\"flex:1 1 280px; min-width:260px; background:#FBF7F0; border:1.5px solid #ECE4D6; border-radius:16px; padding:18px;\\\">\\n        <div style=\\\"display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent); margin-bottom:12px;\\\">🖱️ Server Manager · GUI<\\/div>\\n        <ol style=\\\"margin:0; padding-left:20px; display:flex; flex-direction:column; gap:9px;\\\">\\n          <sc-for list=\\\"{{ step.gui }}\\\" as=\\\"g\\\" hint-placeholder-count=\\\"3\\\"><li style=\\\"color:#3A3B57; font-size:14px; line-height:1.5;\\\">{{ g }}<\\/li><\\/sc-for>\\n        <\\/ol>\\n      <\\/div>\\n    <\\/sc-if>\\n    <sc-if value=\\\"{{ showPs }}\\\" hint-placeholder-val=\\\"{{ true }}\\\">\\n      <div style=\\\"flex:1 1 320px; min-width:300px; background:#17183B; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:4px 5px 0 rgba(23,24,59,0.14);\\\">\\n        <div style=\\\"display:flex; align-items:center; justify-content:space-between; padding:11px 14px; background:rgba(255,255,255,0.05); border-bottom:1px solid rgba(255,255,255,0.08);\\\">\\n          <span style=\\\"display:flex; align-items:center; gap:8px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11.5px; letter-spacing:0.06em; text-transform:uppercase; color:#8FA0FF;\\\">⌨️ PowerShell<\\/span>\\n          <button onClick=\\\"{{ copy }}\\\" style=\\\"cursor:pointer; border:none; background:var(--accent); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:11px; padding:6px 11px; border-radius:9px;\\\">{{ copyLabel }}<\\/button>\\n        <\\/div>\\n        <pre style=\\\"margin:0; padding:16px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.7; color:#E6E9FF; white-space:pre; overflow-x:auto;\\\">{{ step.ps }}<\\/pre>\\n      <\\/div>\\n    <\\/sc-if>\\n  <\\/div>\\n\\n  <sc-if value=\\\"{{ hasTerminal }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div style=\\\"background:#0C0D22; border-radius:16px; overflow:hidden; box-shadow:5px 6px 0 rgba(23,24,59,0.16);\\\">\\n      <div style=\\\"display:flex; align-items:center; gap:8px; padding:10px 14px; background:rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.07);\\\">\\n        <span style=\\\"width:11px; height:11px; border-radius:50%; background:#FF5F57;\\\"><\\/span>\\n        <span style=\\\"width:11px; height:11px; border-radius:50%; background:#FEBC2E;\\\"><\\/span>\\n        <span style=\\\"width:11px; height:11px; border-radius:50%; background:#28C840;\\\"><\\/span>\\n        <span style=\\\"margin-left:8px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#9AA0C8;\\\">{{ step.terminal.title }}<\\/span>\\n      <\\/div>\\n      <pre style=\\\"margin:0; padding:16px 18px; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.7; overflow-x:auto;\\\"><sc-for list=\\\"{{ step.terminal.lines }}\\\" as=\\\"ln\\\" hint-placeholder-count=\\\"4\\\"><div style=\\\"color: {{ ln.c }}; white-space:pre;\\\">{{ ln.t }}<\\/div><\\/sc-for><\\/pre>\\n    <\\/div>\\n  <\\/sc-if>\\n\\n  <sc-if value=\\\"{{ isTip }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div style=\\\"display:flex; gap:12px; align-items:flex-start; background:#EAF0FF; border:1.5px solid #C7D6FF; border-radius:14px; padding:14px 16px;\\\">\\n      <span style=\\\"font-size:18px; line-height:1.4;\\\">💡<\\/span>\\n      <div><span style=\\\"font-family:'Space Grotesk',sans-serif; font-weight:700; color:#2E4CC7;\\\">Mẹo · Tip &nbsp;<\\/span><span style=\\\"color:#2A3A78; font-size:14px; line-height:1.55;\\\">{{ step.tip.vi }}<\\/span><sc-if value=\\\"{{ showEnglish }}\\\" hint-placeholder-val=\\\"{{ true }}\\\"><span style=\\\"color:#7A86B8; font-size:13px; font-style:italic;\\\"> — {{ step.tip.en }}<\\/span><\\/sc-if><\\/div>\\n    <\\/div>\\n  <\\/sc-if>\\n  <sc-if value=\\\"{{ isWarn }}\\\" hint-placeholder-val=\\\"{{ false }}\\\">\\n    <div style=\\\"display:flex; gap:12px; align-items:flex-start; background:#FFF6E0; border:1.5px solid #FFE08A; border-radius:14px; padding:14px 16px;\\\">\\n      <span style=\\\"font-size:18px; line-height:1.4;\\\">⚠️<\\/span>\\n      <div><span sty wPowerShell !== false) && !!s.ps,\\n      hasTerminal: !!(s.terminal && s.terminal.lines && s.terminal.lines.length),\\n      isTip: type === 'tip',\\n      isWarn: type === 'warn',\\n      isDanger: type === 'danger',\\n      copy: this.copy,\\n      copyLabel: this.state.copied ? '✓ Đã copy' : '⧉ Copy',\\n    };\\n  }\\n}\";\n  function reg(){\n    if(!window.__dcUpdate){ setTimeout(reg, 10); return; }\n    window.__dcUpdate('LabStep','js',JS,true);\n    window.__dcUpdate('LabStep','html',TPL,true);\n    window.__dcUpdate('LabStep','js',JS,false);\n    window.__dcUpdate('LabStep','html',TPL,false);\n  }\n  reg();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
